<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会話クイズ | Kaiwa Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+Sinhala:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #1F1B3A;
    --indigo: #4B3F9E;
    --indigo-deep: #322A72;
    --violet: #8B6FE0;
    --lilac-bg: #F5F3FC;
    --paper: #FFFFFF;
    --line: #E4DFF5;
    --correct: #1FA971;
    --correct-bg: #E7F8F1;
    --wrong: #E14B4B;
    --wrong-bg: #FCEBEB;
    --muted: #726B93;
    --shadow: 0 12px 30px -12px rgba(50, 42, 114, 0.25);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1100px 500px at 10% -10%, #EDE8FC 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 0%, #E3F1FF 0%, transparent 55%),
      var(--lilac-bg);
    font-family:'Inter', 'Noto Sans Sinhala', sans-serif;
    color:var(--ink);
    min-height:100vh;
    padding: 24px 16px 60px;
  }
  .jp{ font-family:'Noto Sans JP','Zen Maru Gothic',sans-serif; }
  .si{ font-family:'Noto Sans Sinhala', sans-serif; }

  .shell{ max-width: 720px; margin: 0 auto; }

  /* ---------- Header ---------- */
  .app-title{
    display:flex; align-items:center; gap:10px;
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:900; font-size: 22px; letter-spacing:.5px;
    color: var(--indigo-deep);
    margin-bottom: 18px;
  }
  .app-title .dot{
    width:10px;height:10px;border-radius:50%;
    background: linear-gradient(135deg, var(--violet), var(--indigo));
    box-shadow: 0 0 0 5px rgba(139,111,224,0.18);
  }

  .paper-bar{
    display:flex; gap:10px; flex-wrap:wrap; align-items:center;
    margin-bottom: 18px;
  }
  .paper-chip{
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700; font-size: 14px;
    padding: 9px 16px; border-radius: 999px;
    background: var(--paper); color: var(--indigo-deep);
    border: 1.5px solid var(--line);
    cursor: pointer;
    transition: all .18s ease;
    white-space: nowrap;
  }
  .paper-chip.active{
    background: linear-gradient(135deg, var(--indigo), var(--violet));
    color: #fff; border-color: transparent;
    box-shadow: var(--shadow);
  }
  .paper-chip.add{
    background: transparent; border: 1.5px dashed #C8BFEC; color: var(--muted);
  }
  .paper-chip.add:hover{ border-color: var(--indigo); color: var(--indigo); }

  .header-card{
    background: linear-gradient(135deg, var(--indigo-deep), var(--indigo) 55%, var(--violet));
    border-radius: 22px;
    padding: 20px 22px;
    color: #fff;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }
  .header-card::after{
    content:"";
    position:absolute; right:-40px; top:-60px;
    width:180px; height:180px; border-radius:50%;
    background: rgba(255,255,255,0.08);
  }
  .header-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; position:relative; z-index:1;}
  .paper-name{ font-family:'Zen Maru Gothic', sans-serif; font-weight:800; font-size: 17px; }
  .q-counter{ font-family:'Zen Maru Gothic', sans-serif; font-weight:700; font-size: 15px; opacity:.95; }
  .progress-track{
    margin-top: 14px; height: 9px; border-radius: 999px;
    background: rgba(255,255,255,0.22);
    overflow: hidden; position:relative; z-index:1;
  }
  .progress-fill{
    height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, #FFD976, #FFFFFF);
    transition: width .35s ease;
  }

  /* ---------- Question Card ---------- */
  .card{
    background: var(--paper);
    border-radius: 24px;
    padding: 26px 24px 24px;
    box-shadow: var(--shadow);
    border: 1px solid var(--line);
    animation: rise .35s ease;
  }
  @keyframes rise{ from{ opacity:0; transform: translateY(10px);} to{opacity:1; transform:none;} }

  .q-meta{
    display:flex; align-items:center; gap:8px;
    font-size: 12.5px; font-weight:700; color: var(--muted);
    text-transform: uppercase; letter-spacing: .06em;
    margin-bottom: 14px;
  }
  .q-meta .badge{
    background: var(--lilac-bg); color: var(--indigo);
    padding: 4px 10px; border-radius: 999px;
    border: 1px solid var(--line);
  }

  .img-desc{
    background: #FBF8FF;
    border: 1px dashed #D8CFF5;
    border-radius: 16px;
    padding: 14px 16px;
    font-size: 14.5px;
    color: var(--indigo-deep);
    line-height: 1.65;
    margin-bottom: 16px;
  }
  .img-desc .label{ font-weight:700; font-size:12.5px; color:var(--violet); display:block; margin-bottom:4px; letter-spacing:.03em;}

  .q-sentence{
    font-family:'Noto Sans JP', sans-serif;
    font-size: 21px; line-height: 1.75; font-weight: 500;
    color: var(--ink);
    margin-bottom: 18px;
    word-break: break-word;
  }

  /* Kaiwa dialogue */
  .kaiwa{ display:flex; flex-direction:column; gap:10px; margin-bottom: 18px; }
  .bubble-row{ display:flex; }
  .bubble-row.left{ justify-content:flex-start; }
  .bubble-row.right{ justify-content:flex-end; }
  .bubble{
    max-width: 86%;
    padding: 12px 16px;
    border-radius: 18px;
    font-family:'Noto Sans JP', sans-serif;
    font-size: 17.5px;
    line-height: 1.65;
    position: relative;
  }
  .bubble .speaker{
    display:block; font-family:'Inter',sans-serif; font-weight:800; font-size: 11.5px;
    letter-spacing:.08em; text-transform:uppercase; margin-bottom: 4px; opacity:.75;
  }
  .bubble-row.left .bubble{
    background: #F0EDFB; color: var(--indigo-deep);
    border-bottom-left-radius: 6px;
  }
  .bubble-row.right .bubble{
    background: linear-gradient(135deg, var(--indigo), var(--violet));
    color:#fff;
    border-bottom-right-radius: 6px;
  }
  .blank{
    display:inline-block;
    min-width: 46px;
    border-bottom: 2.5px solid currentColor;
    margin: 0 2px;
  }

  .translate-btn{
    display:inline-flex; align-items:center; gap:7px;
    background: var(--lilac-bg); color: var(--indigo);
    border: 1.5px solid var(--line);
    font-weight:700; font-size: 14px;
    padding: 9px 16px; border-radius: 999px;
    cursor:pointer; margin-bottom: 10px;
    transition: all .15s ease;
    font-family:'Inter',sans-serif;
  }
  .translate-btn:hover{ background:#fff; border-color: var(--indigo); }

  .translation-box{
    display:none;
    background: #F4FAF7;
    border: 1px solid #CDEBDD;
    border-radius: 14px;
    padding: 12px 15px;
    margin-bottom: 16px;
    font-size: 14.5px;
    color: #1F5B45;
    line-height: 1.7;
  }
  .translation-box.show{ display:block; animation: rise .25s ease; }
  .translation-box .label{ font-weight:700; font-size:12px; letter-spacing:.05em; text-transform:uppercase; color:#2E8A66; display:block; margin-bottom:4px;}
  .translation-box .note{ font-style: italic; color: #6b7c74; }

  /* Options */
  .options{ display:flex; flex-direction:column; gap:12px; margin-top: 4px; }
  .opt-btn{
    display:flex; align-items:center; gap:12px;
    background: var(--paper);
    border: 2px solid var(--line);
    border-radius: 16px;
    padding: 15px 16px;
    text-align:left;
    cursor:pointer;
    font-family:'Noto Sans JP', sans-serif;
    font-size: 17px;
    color: var(--ink);
    transition: all .15s ease;
    min-height: 56px;
  }
  .opt-btn:hover:not(:disabled){ border-color: var(--violet); background: #FAF8FF; transform: translateY(-1px); }
  .opt-btn:disabled{ cursor: default; }
  .opt-letter{
    flex:0 0 32px; height:32px; border-radius:10px;
    background: var(--lilac-bg); color: var(--indigo);
    display:flex; align-items:center; justify-content:center;
    font-family:'Inter',sans-serif; font-weight:800; font-size: 14px;
  }
  .opt-btn.correct{ background: var(--correct-bg); border-color: var(--correct); }
  .opt-btn.correct .opt-letter{ background: var(--correct); color:#fff; }
  .opt-btn.wrong{ background: var(--wrong-bg); border-color: var(--wrong); }
  .opt-btn.wrong .opt-letter{ background: var(--wrong); color:#fff; }

  .result-area{ display:none; margin-top: 18px; }
  .result-area.show{ display:block; animation: rise .3s ease; }
  .result-banner{
    font-weight:800; font-size: 16.5px; padding: 12px 16px;
    border-radius: 14px; margin-bottom: 12px;
    display:flex; align-items:center; gap:8px;
    font-family:'Zen Maru Gothic', sans-serif;
  }
  .result-banner.ok{ background: var(--correct-bg); color:#146B4B; }
  .result-banner.no{ background: var(--wrong-bg); color:#A32B2B; }
  .answer-reveal{
    background: var(--lilac-bg); border-radius: 14px; padding: 14px 16px;
    border: 1px solid var(--line);
  }
  .answer-reveal .row{ margin-bottom: 8px; }
  .answer-reveal .row:last-child{ margin-bottom:0; }
  .answer-reveal .label{ font-weight:700; font-size:12.5px; color: var(--indigo); text-transform:uppercase; letter-spacing:.05em; display:block; margin-bottom:3px;}
  .answer-reveal .jp-ans{ font-family:'Noto Sans JP',sans-serif; font-size: 17px; }
  .answer-reveal .meaning-note{ font-style: italic; color: var(--muted); font-size: 14px; }

  /* Nav */
  .nav-row{
    display:flex; justify-content:space-between; align-items:center;
    margin-top: 22px; gap:12px;
  }
  .nav-btn{
    flex:1;
    padding: 14px 18px; border-radius: 14px;
    font-weight:800; font-size: 15px; cursor:pointer;
    font-family:'Inter',sans-serif;
    border: none;
    transition: all .15s ease;
  }
  .nav-btn.prev{ background: var(--paper); color: var(--indigo); border: 2px solid var(--line); }
  .nav-btn.prev:hover:not(:disabled){ border-color: var(--indigo); }
  .nav-btn.next{ background: linear-gradient(135deg, var(--indigo), var(--violet)); color: #fff; box-shadow: var(--shadow); }
  .nav-btn.next:hover:not(:disabled){ filter: brightness(1.06); }
  .nav-btn:disabled{ opacity:.4; cursor:not-allowed; }

  /* Completion */
  .complete-card{
    text-align:center; padding: 50px 24px;
  }
  .complete-card .emoji{ font-size: 56px; margin-bottom: 14px; }
  .complete-card h2{ font-family:'Zen Maru Gothic',sans-serif; color: var(--indigo-deep); margin: 0 0 8px; font-size:24px;}
  .complete-card p{ color: var(--muted); margin: 0 0 22px; font-size:15px; }
  .score-pill{
    display:inline-block; background: var(--lilac-bg); border:1px solid var(--line);
    padding: 10px 22px; border-radius:999px; font-weight:800; color: var(--indigo); margin-bottom:22px;
  }
  .restart-btn{
    background: linear-gradient(135deg, var(--indigo), var(--violet)); color:#fff;
    border:none; padding: 13px 26px; border-radius: 14px; font-weight:800; cursor:pointer; font-size:15px;
    box-shadow: var(--shadow);
  }

  @media (max-width: 480px){
    .q-sentence{ font-size: 19px; }
    .bubble{ font-size: 16px; max-width: 92%;}
    .opt-btn{ font-size: 16px; }
    .header-card{ padding: 16px 16px; }
    .card{ padding: 20px 16px; }
  }

  /* ---------- Mode tabs ---------- */
  .mode-tabs{
    display:flex; gap:8px; margin-bottom: 16px;
    background: var(--paper); border: 1.5px solid var(--line);
    border-radius: 999px; padding: 5px;
  }
  .mode-tab{
    flex:1; text-align:center;
    font-family:'Zen Maru Gothic', sans-serif; font-weight:800; font-size: 14.5px;
    padding: 10px 12px; border-radius: 999px; border:none; cursor:pointer;
    background: transparent; color: var(--muted);
    transition: all .18s ease;
  }
  .mode-tab.active{
    background: linear-gradient(135deg, var(--indigo), var(--violet));
    color:#fff; box-shadow: var(--shadow);
  }

  /* ---------- Reading section ---------- */
  .reading-shell{ display:flex; flex-direction:column; gap:16px; }
  .reading-title-card{
    background: linear-gradient(135deg, var(--indigo-deep), var(--indigo) 55%, var(--violet));
    border-radius: 22px; padding: 18px 22px; color:#fff; box-shadow: var(--shadow);
    font-family:'Zen Maru Gothic', sans-serif; font-weight:800; font-size: 17px;
  }
  .reading-title-card small{
    display:block; font-family:'Inter',sans-serif; font-weight:500; font-size: 12.5px;
    opacity:.85; margin-top:4px; letter-spacing:.02em;
  }
  .rnote-card{
    background: var(--paper); border-radius: 20px; padding: 18px 20px;
    box-shadow: var(--shadow); border: 1px solid var(--line);
  }
  .rnote-id{
    display:inline-block; font-family:'Inter',sans-serif; font-weight:800; font-size:12.5px;
    color: var(--indigo); background: var(--lilac-bg); border:1px solid var(--line);
    padding: 3px 11px; border-radius:999px; margin-bottom: 12px; letter-spacing:.04em;
  }
  .rnote-scenario{
    background: #FBF8FF; border: 1px dashed #D8CFF5; border-radius: 14px;
    padding: 12px 14px; font-size: 14px; color: var(--indigo-deep); line-height:1.6;
    margin-bottom: 14px;
  }
  .rnote-scenario .label{ font-weight:700; font-size:11.5px; color:var(--violet); display:block; margin-bottom:3px; letter-spacing:.03em; }
  .rline{ margin-bottom: 14px; }
  .rline:last-child{ margin-bottom: 0; }
  .rline .rspeaker{
    font-family:'Inter',sans-serif; font-weight:800; font-size: 11px;
    letter-spacing:.08em; text-transform:uppercase; color: var(--violet); margin-bottom: 4px;
  }
  .rline .rjp{
    font-family:'Noto Sans JP', sans-serif; font-size: 18px; line-height:1.6; color: var(--ink);
  }
  .rline .rromaji{
    font-family:'Inter', sans-serif; font-style: italic; font-size: 13px; color: var(--muted);
    margin-top: 3px;
  }
  .rline .rsi{
    font-size: 14.5px; color: #1F5B45; background:#F4FAF7; border:1px solid #CDEBDD;
    border-radius: 10px; padding: 8px 11px; margin-top: 6px; line-height:1.6;
  }
  .rnote-extra{
    margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line);
    font-size: 13px; color: var(--muted); line-height: 1.6;
  }
  .rnote-extra .label{ font-weight:700; color:var(--indigo); font-size:11.5px; display:block; margin-bottom:4px; letter-spacing:.03em; }

  /* ---------- Review sections (wrong answers / answer key) ---------- */
  .review-section{ text-align:left; margin-top: 26px; }
  .review-head{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px; flex-wrap:wrap; margin-bottom: 12px;
  }
  .review-title{
    font-family:'Zen Maru Gothic', sans-serif; font-weight:800; font-size: 16px;
    color: var(--indigo-deep); display:flex; align-items:center; gap:8px;
  }
  .copy-btn{
    display:inline-flex; align-items:center; gap:6px;
    background: var(--lilac-bg); color: var(--indigo);
    border: 1.5px solid var(--line);
    font-weight:700; font-size: 13px;
    padding: 8px 14px; border-radius: 999px;
    cursor:pointer; transition: all .15s ease;
    font-family:'Inter',sans-serif;
  }
  .copy-btn:hover{ background:#fff; border-color: var(--indigo); }
  .copy-btn.copied{ background: var(--correct-bg); border-color: var(--correct); color:#146B4B; }
  .review-empty{
    font-size: 14px; color: var(--muted); background: var(--lilac-bg);
    border-radius: 14px; padding: 14px 16px; border:1px solid var(--line);
  }
  .review-list{ display:flex; flex-direction:column; gap:12px; }
  .review-item{
    background: var(--paper); border: 1px solid var(--line);
    border-radius: 16px; padding: 14px 16px;
  }
  .review-item.wrong{ border-color: #F3C8C8; background: #FFF9F9; }
  .review-item .q-label{
    font-weight:800; font-size: 12.5px; color: var(--violet);
    text-transform:uppercase; letter-spacing:.05em; margin-bottom: 6px; display:block;
  }
  .review-item .q-text{
    font-family:'Noto Sans JP', sans-serif; font-size: 15.5px; color: var(--ink);
    margin-bottom: 8px; line-height:1.6; word-break: break-word;
  }
  .review-item .row{ font-size: 13.5px; margin-bottom: 4px; line-height:1.6; }
  .review-item .row:last-child{ margin-bottom:0; }
  .review-item .row .tag{
    font-weight:700; font-size: 11.5px; color: var(--muted);
    text-transform:uppercase; letter-spacing:.04em; margin-right:6px;
  }
  .review-item .row.wrong-ans{ color: var(--wrong); }
  .review-item .row.correct-ans{ color: var(--correct); }
  .review-item .row.meaning-si{ color: #1F5B45; }
  .copy-textarea{
    position:absolute; left:-9999px; top:-9999px;
  }

  /* ---------- Kanji view ---------- */
  .kanji-shell{ display:flex; flex-direction:column; gap:16px; }
  .kanji-title-card{
    background: linear-gradient(135deg, var(--indigo-deep), var(--indigo) 55%, var(--violet));
    border-radius: 22px; padding: 18px 22px; color:#fff; box-shadow: var(--shadow);
    font-family:'Zen Maru Gothic', sans-serif; font-weight:800; font-size: 17px;
  }
  .kanji-title-card small{
    display:block; font-family:'Inter',sans-serif; font-weight:500; font-size: 12.5px;
    opacity:.85; margin-top:4px; letter-spacing:.02em;
  }
  .kanji-toolbar{ display:flex; justify-content:flex-end; }
  .kanji-list{ display:flex; flex-direction:column; gap:12px; }
  .kanji-item{
    background: var(--paper); border: 1px solid var(--line);
    border-radius: 16px; padding: 14px 16px;
    display:flex; flex-direction:column; gap:7px;
  }
  .kanji-item .word{
    font-family:'Noto Sans JP', sans-serif; font-size: 21px; font-weight:700; color: var(--ink);
  }
  .kanji-item .meaning{
    font-size: 14px; color: #1F5B45; background:#F4FAF7; border:1px solid #CDEBDD;
    border-radius: 10px; padding: 8px 11px; line-height:1.6;
  }
  .kanji-item .source{
    font-size: 11.5px; color: var(--muted); font-family:'Inter',sans-serif; letter-spacing:.02em;
  }

  /* ---------- Kanji sub-tabs ---------- */
  .kanji-subtabs{
    display:flex; gap:8px; margin-bottom: 18px;
  }
  .kanji-subtab{
    flex:1; padding: 10px 14px; border-radius: 14px; border: 1.5px solid var(--line);
    background: var(--paper); color: var(--muted); font-weight:700; font-size: 14px;
    cursor:pointer; transition: all .15s ease; font-family:'Inter',sans-serif;
  }
  .kanji-subtab.active{
    background: var(--indigo); border-color: var(--indigo); color:#fff;
  }

  /* ---------- Kanji exam (flashcard) ---------- */
  .exam-card{
    background: var(--paper); border: 1px solid var(--line); border-radius: 22px;
    box-shadow: var(--shadow); padding: 34px 24px; text-align:center;
  }
  .exam-progress{
    font-size: 12.5px; font-weight:700; color: var(--muted); letter-spacing:.05em;
    text-transform:uppercase; margin-bottom: 18px; font-family:'Inter',sans-serif;
  }
  .exam-kanji-big{
    font-family:'Noto Sans JP','Zen Maru Gothic',sans-serif; font-weight:700;
    font-size: 72px; color: var(--ink); line-height:1.2; word-break:break-word;
  }
  .exam-answer-box{ margin-top: 22px; }
  .exam-reading{
    font-size: 20px; color: var(--indigo); font-weight:700; margin-bottom: 10px;
  }
  .exam-meaning{
    font-size: 16px; color: #1F5B45; background:#F4FAF7; border:1px solid #CDEBDD;
    border-radius: 12px; padding: 10px 14px; display:inline-block; line-height:1.6;
  }

  /* Similar Kanji shown only inside the Exam answer reveal */
  .exam-similar{ margin-top:18px; padding-top:16px; border-top:1px dashed var(--line); text-align:left; }
  .exam-similar-title{ font-size:12px; font-weight:800; color:var(--violet); letter-spacing:.04em; margin-bottom:9px; }
  .exam-similar-row{ display:flex; gap:8px; overflow-x:auto; padding:2px 1px 5px; scrollbar-width:thin; }
  .exam-similar-item{ flex:0 0 auto; min-width:110px; background:#FBF8FF; border:1px solid var(--line); border-radius:12px; padding:8px 9px; text-align:center; }
  .exam-similar-kanji{ font-family:'Noto Sans JP','Zen Maru Gothic',sans-serif; font-size:34px; font-weight:700; color:var(--ink); line-height:1.15; }
  .exam-similar-reading{ font-family:'Noto Sans JP',sans-serif; font-size:11px; color:var(--indigo); font-weight:700; margin-top:3px; }
  .exam-similar-meaning{ font-size:10.5px; color:var(--muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .exam-actions{
    display:flex; gap:10px; margin-top: 20px; justify-content:center; flex-wrap:wrap;
  }
  .exam-show-btn{
    background: var(--indigo); color:#fff; border:none; font-weight:700; font-size: 15px;
    padding: 13px 26px; border-radius: 999px; cursor:pointer; font-family:'Inter',sans-serif;
    transition: all .15s ease;
  }
  .exam-show-btn:hover{ background: var(--indigo-deep); }
  .exam-mark-btn{
    flex:1; min-width: 140px; border:1.5px solid var(--line); font-weight:700; font-size: 15px;

      { n:27, page:27, kaiwa:[{s:"男",t:"「セーシバ」と「スギシタ」どっちが使いやすいですか？"},{s:"女",t:"「セーシバ」のほうが使いやすいよ。"}], translation:"男（පිරිමියා）: 'සේෂිබා' සහ 'සුගිෂිතා' අතරින් පාවිච්චි කරන්න ලේසි කුමක්ද?\n女（ගැහැණිය）: 'සේෂිබා' තමයි පාවිච්චි කරන්න ලේසි.", options:["と言います","と聞きます","と思います"], correct:2, meaning:"කියලා හිතනවා" },
      { n:28, page:28, kaiwa:[{s:"A",t:"ケティーさん、からい料理がすきですか？"},{s:"B",t:"はい、すきです。______、カレーとか、キムチとか"},{s:"A",t:"私もキムチが好きです。"}], translation:"A: කැටී, රස්නෙ කෑම වර්ග කැමතිද?\nB: ඔව්, කැමතියි. ______, කරි වගේ, කිම්චි වගේ.\nA: මමත් කිම්චි කැමතියි.", options:["たとえば","たしかに","とにかく"], correct:0, meaning:"උදාහරණයක් ලෙස" },
      { n:29, page:29, kaiwa:[{s:"A",t:"新しい仕事はどうですか？"},{s:"B",t:"たいへんです、______、がんばります。"}], translation:"A: අලුත් රැකියාව කොහොමද?\nB: අමාරුයි, ______, උත්සාහ කරනවා.", options:["できれば","でも","だけど"], correct:1, meaning:"නමුත්" },
      { n:30, page:30, question:"かがくはくぶつかん　はどこですか", imageDesc:"Map එකක් (ගඟ, පාලම්, ගොඩනැගිලි a, b, c ලෙස ලේබල් කරලා තියෙනවා. පහළ වම් පැත්තේ ★ ලකුණක්).", translation:"විද්‍යා කෞතුකාගාරය කොහෙද තියෙන්නේ?", options:["A","B","C"], correct:0, meaning:"සිතියමේ A ස්ථානය" }
    ]
  },
  "hare-update": {
    title: "📄 HARE UPDATE",
    questions: [
      { n:1, page:1, imageDesc:"නිල් අහස, හිරු, සුදු වලාකුළු.", options:["晴れ（はれ）","曇り（くもり）","雨（あめ）"], correct:0, meaning:"අහස පැහැදිලියි / හිරු එළිය" },
      { n:2, page:2, imageDesc:"තාච්චි (toilet) එකක්.", options:["だいところ","トイレ","じむしょ"], correct:1, meaning:"වැසිකිළිය" },
      { n:3, page:3, imageDesc:"කඩදාසි ගොඩක්.", options:["きっぷ","かみ","カメラ"], correct:1, meaning:"කඩදාසිය" },
      { n:4, page:4, imageDesc:"කුණු බඳුනක් (trash can).", options:["ごみばこ","ポリ袋","ほうき"], correct:0, meaning:"කුණු බඳුන" },
      { n:5, page:5, imageDesc:"ගැහැණුන් තුන්දෙනෙක් කතා කරනවා.", options:["わかれます","うんてんします","しょうかいします"], correct:2, meaning:"හඳුන්වා දෙනවා (introduce)" },
      { n:6, page:6, sentence:"明日、日本語の試験がありますよ。", translation:"හෙට, ජපන් භාෂා විභාගයක් තියෙනවා.", options:["しょくじ","しゅくだい","しけん"], correct:2, meaning:"විභාගය" },
      { n:7, page:7, kaiwa:[{s:"A",t:"昨日コピー機のスイッチは入ったまま"},{s:"B",t:"昨日はわすれてしまいました。"},{s:"A",t:"つぎは______きってくださいね。"}], translation:"A: ඊයේ කොපි මැෂිමේ ස්විචය දාපු විදිහටම තිබුණා.\nB: ඊයේ අමතක වුණා.\nA: ඊළඟට ______ (කරුණාකර) ස්විචය නිවන්න.", options:["かならず","すぐ","ときどき"], correct:0, meaning:"අනිවාර්යයෙන්ම / හැම විටම" },
      { n:8, page:8, sentence:"このきょうしつで、男のほうがおおいです。", translation:"මේ පන්ති කාමරයේ, පිරිමින් වැඩියි.", options:["おんな","おとこ","こども"], correct:1, meaning:"පිරිමි (男)" },
      { n:9, page:9, kaiwa:[{s:"A",t:"ダダンさん、朝はパンをたべますか。"},{s:"B",t:"はい、でもときどきご飯を______。"}], translation:"A: දඩාන් සමා, උදේට පාන් කනවද?\nB: ඔව්, ඒත් සමහර වෙලාවට බත් ______ (කනවා).", options:["みます","のみます","たべます"], correct:2, meaning:"කනවා" },
      { n:10, page:10, sentence:"ここでは、けいたいでんわを______でください。", translation:"මෙතන, ජංගම දුරකථනය ______ එපා (භාවිතා නොකරන්න).", options:["つかいました（使いました）","つかう（使う）","つかわない（使わない）"], correct:2, meaning:"පාවිච්චි කරන්නේ නැහැ / පාවිච්චි කරන්න එපා" },
      { n:11, page:11, sentence:"まだ勉強していないので、明日のしけんは______です。", translation:"තාම පාඩම් කරලා නැති නිසා, හෙට විභාගය ගැන ______ (කනස්සල්ලයි).", options:["うれしい（嬉しい）","しんぱい（心配）","たのしい（楽しい）"], correct:1, meaning:"කනස්සල්ල / බය" },
      { n:12, page:12, sentence:"このまちで高いビルがたくさんありますね。", translation:"මේ නගරයේ උස ගොඩනැගිලි ගොඩක් තියෙනවා නේද.", options:["ひくい","あつい","たかい"], correct:2, meaning:"උස" },
      { n:13, page:13, sentence:"昨日の午前は洗濯しました。", translation:"ඊයේ උදේ (පෙරවරුවේ) රෙදි සෝදුවා.", options:["ごぜん","ごご","ぎゅうにく"], correct:0, meaning:"උදෑසන / පෙරවරුව" },
      { n:14, page:14, sentence:"タイラーさんは幸せですね", translation:"ටයිලර් සතුටින් ඉන්නවා නේද.", options:["しらせ","しあわせ","はなせ"], correct:1, meaning:"සතුටින් / සන්තුෂ්ටියෙන්" },
      { n:15, page:15, sentence:"日本語教室はどこですか？", translation:"ජපන් භාෂා පන්ති කාමරය කොහෙද?", options:["きょしつ","きょうしつ","きょしうう"], correct:1, meaning:"පන්ති කාමරය" },
      { n:16, page:16, sentence:"かいぎはもうはじまったんですね、入ることはもう______。", translation:"රැස්වීම දැනටමත් පටන් අරන්, ඇතුල් වෙන්න දැන් ______ (බෑ ද)?", options:["ちょっとですか？","いちどですか？","むりですか？"], correct:2, meaning:"බෑ ද / කළ නොහැකිද" },
      { n:17, page:17, sentence:"かばんがおおきい、でも______です。", translation:"බෑගය ලොකුයි, ඒත් ______ (සැහැල්ලුයි).", options:["重い（おもい）","軽い（かるい）","強い（つよい）"], correct:1, meaning:"සැහැල්ලුයි" },
      { n:18, page:18, kaiwa:[{s:"女",t:"イルカさん、昼ご飯いっしょに______。"},{s:"男",t:"そう、しましょう。"}], translation:"女（ගැහැණිය）: ඉරුකා, දවල් කෑම එකට ______ (කන්නද)?\n男（පිරිමියා）: ඔව්, කරමු.", options:["のみませんか？","たべませんでしたか？","たべませんか？"], correct:2, meaning:"කන්නද? (එකට කෑම කන්නද)" },
      { n:19, page:19, sentence:"好きな______は春です。", translation:"මම කැමතිම ______ (සෘතුව) වසන්තයයි.", options:["きせつ","きせき","きょうしつ"], correct:0, meaning:"සෘතුව" },
      { n:20, page:20, sentence:"______にごみをすててください。", translation:"______ (කුණු බඳුනට) කුණු දාන්න.", options:["ともだち","うち","ごみばこ"], correct:2, meaning:"කුණු බඳුන" },
      { n:21, page:21, sourceNote:"මෙම ප්‍රශ්නයේ (\"2 KOTASA\") සම්පූර්ණ සංවාදය (Kaiwa - directions/home) මූලාශ්‍ර ගොනුවේ සපයා නොමැත — [NOT CLEAR IN SOURCE]", options:["ここでいいです","こちらこそ","ありがとうございます"], correct:0, meaning:"මෙතනින් හොඳයි (ප්‍රමාණවත්)" },
      { n:22, page:22, kaiwa:[{s:"A",t:"やまださん、どうしましたか？"},{s:"B",t:"昨日から、のどがいたいんです。______"},{s:"A",t:"あたたかいお茶を飲んだほうがいいですよ。"}], translation:"A: යමදා, මොකද වුණේ?\nB: ඊයේ ඉඳලා, උගුරේ අමාරුවක්. ______\nA: උණුසුම් තේ බීමම හොඳයි.", options:["おめでとうございます","それはよかったですね","それはいけませんね"], correct:2, meaning:"ඒක අමාරුයි නේද (කණගාටුයි)" },
      { n:23, page:23, question:"うちにだれがいますか？", sentence:"うちに私と妻と______がいます。", translation:"ගෙදර කවුද ඉන්නේ?\nගෙදර මම, බිරිඳ සහ ______ (සුරතලා) ඉන්නවා.", options:["ボトル","ベード","ペット"], correct:2, meaning:"සුරතල් සතා" },
      { n:24, page:24, kaiwa:[{s:"A",t:"マリアさん、すてきなかばんですね"},{s:"B",t:"これですか？ 誕生日にともだちに______"}], translation:"A: මාරියා, බෑගය ලස්සනයි නේද.\nB: මේකද? උපන්දිනයට යාළුවෙක්ගෙන් ______ (ලැබුණා).", options:["もらいました","あげました","くれました"], correct:0, meaning:"ලැබුණා (තෑග්ගක් ලෙස)" },
      { n:25, page:25, sourceNote:"මෙම ප්‍රශ්නයේ සම්පූර්ණ සංවාදය (Kaiwa - about copy machine) මූලාශ්‍ර ගොනුවේ සපයා නොමැත — [NOT CLEAR IN SOURCE]", options:["使った","教えた","持った"], correct:0, meaning:"පාවිච්චි කළා" },
      { n:26, page:26, kaiwa:[{s:"A",t:"わかやまにおすすめところはどこですか？"},{s:"B",t:"わかやまなら（けんろくえん）がゆうめいですよ______行ってみてください"}], translation:"A: වකායමාහි නිර්දේශිත තැනක් මොකක්ද?\nB: වකායමා නම්, (කෙන්‍රොකුඑන්) ප්‍රසිද්ධයි. ______ ගිහින් බලන්න.", options:["たぶん","ぜんぜん","ぜひ"], correct:2, meaning:"අනිවාර්යයෙන්ම / කැමැත්තෙන්ම" },
      { n:27, page:27, question:"日本語はどうですか？", sentence:"前より、______ようになりました。", translation:"ජපන් භාෂාව කොහොමද?\nකලින්ට වඩා, ______ (කතා කරන්න පුළුවන්) වුණා.", options:["はなす","はなせる","はなし"], correct:1, meaning:"කතා කරන්න පුළුවන් වුණා" },
      { n:28, page:28, kaiwa:[{s:"A",t:"( ______ )"},{s:"B",t:"お疲れさまでした"}], translation:"A: ( ______ )\nB: වෙහෙස මහන්සි වුණා (ගෙදර යනකොට කියන වචනයක්).", options:["さきにしつれいします","これからもよろしく","おめでとうございます"], correct:0, meaning:"මම කලින් යනවා (සමාවෙන්න)" },
      { n:29, page:29, kaiwa:[{s:"A",t:"さいきんかたがいたいです"},{s:"B",t:"私もです。かたをあたためるといいそうですよ。わたしは______、毎日おふろに入っています"}], translation:"A: මෑතකදී උරහිස රිදෙනවා.\nB: මටත් එහෙමයි. උරහිස රත් කිරීම හොඳයි කියලා ඇහුවා. මම ______ (හොඳ වෙන්න), හැම දාම නාන කාමරයට යනවා.", options:["よくならに","よくなるように","よくしたくて"], correct:1, meaning:"හොඳ වෙන්න වෙනුවෙන්" }

      { n:7, sentence:"こどものときギターを ...", translation:"පුංචි කාලේ ගිටාරය ... (ඉගෙන ගත්තා).", options:["はたらきました","おりました","ならいました"], correct:2, meaning:"ඉගෙන ගත්තා" },
      { n:8, imageDesc:"නිවසකට typhoon/tornado එකක් වැදී තියෙනවා (වැස්ස, අකුණු).", question:"今の天気はどうなりますか？", translation:"දැන් කාලගුණය කොහොමද වෙන්නේ?", options:["晴れ","風邪","台風"], correct:2, meaning:"සුළිසුළං" },
      { n:9, kaiwa:[{s:"女",t:"すみません、れいぞこがこわれたので…"},{s:"男",t:"とりあえず、チェックします。"},{s:"女",t:"はい、______"}], translation:"女: සමාවෙන්න, ෆ්‍රිජ් එක කැඩිලා තියෙන නිසා…\n男: දැනට, මම චෙක් කරන්නම්.\n女: හරි, ______ (කරුණාකර).", options:["おねがいします","すみません","かまいません"], correct:0, meaning:"කරුණාකර / ඉල්ලා සිටිමි" },
      { n:10, kaiwa:[{s:"男",t:"日本語をどのくらい勉強しましたか？"},{s:"女",t:"______ぐらい、勉強しました。"}], translation:"男: ජපන් භාෂාව කොපමණ කාලයක් ඉගෙන ගත්තද?\n女: ______ පමණ ඉගෙන ගත්තා.", options:["5かげつ","5つ","5かがつ"], correct:0, meaning:"මාස 5ක්" },
      { n:11, kaiwa:[{s:"男",t:"パーティー始まる前に、ケーキはたべ______です"},{s:"女",t:"すみませんでした。"}], translation:"男: පාටිය පටන් ගන්න කලින්, කේක් කන්න ______.\n女: සමාවෙන්න.", options:["てもいい","ちゃだめ","てもだめ"], correct:1, meaning:"කරගන්න බෑ / තහනම්" },
      { n:12, kaiwa:[{s:"男",t:"仕事はどうですか？"},{s:"女",t:"たいへん______勉強になります。"}], translation:"男: රැකියාව කොහොමද?\n女: ගොඩක් අමාරුයි ______, ඒත් ඉගෙනීමක් වෙනවා.", options:["できれば","だったら","ですが"], correct:2, meaning:"නමුත්" },
      { n:13, kaiwa:[{s:"女",t:"エリカ______"},{s:"男",t:"エリカさんですね、よろしくお願いします。"}], translation:"女: එරිකා ______\n男: එරිකා නේද, කරුණාකර හොඳින් සලකන්න.", options:["といういみです","とはなしてください","とよんでください"], correct:2, meaning:"කියලා අමතන්න" },
      { n:14, kaiwa:[{s:"女",t:"次の信号を右に曲がってください。……あ、______ありがとうございました"},{s:"男",t:"ここ？じゃあ、お疲れさまでした。また明日。"}], translation:"女: ඊළඟ සිග්නලයේදී දකුණට හැරෙන්න. ...ආහ්, ______ ස්තූතියි.\n男: මෙතනද? එහෙනම්, වෙහෙස මහන්සි වුණා. හෙට හමුවෙමු.", options:["待ってください","あちらになります","ここでいいです"], correct:2, meaning:"මෙතනින් හොඳයි (ප්‍රමාණවත්)" },
      { n:15, kaiwa:[{s:"A",t:"今夜、おおさいたいふうがきますよ。川が近いから、心配ですね"},{s:"B",t:"そうですね、夜は危ないから、______ひなんじょにいきます"}], translation:"A: අද රෑ, ලොකු තුෆානයක් එනවා. ගඟ ළඟින් තියෙන නිසා කනගාටුයි නේද.\nB: ඔව්, රෑට අන්තරාදායකයි, ______ ආරක්ෂිත ස්ථානයට යනවා.", options:["はやめに","あわてて","たしかに"], correct:0, meaning:"ඉක්මනින් / කලින්ම" },
      { n:16, kaiwa:[{s:"A",t:"マヤさん、ジュースを買いに行きますけど、なにか______きましょうか？"},{s:"B",t:"あ、コーヒー、お願いします。"}], translation:"A: මායා, මම ජූස් ගන්න යනවා, ඔයාට මොකක් හරි ______ ගෙනාවද?\nB: ආහ්, කෝපි, කරුණාකර.", options:["買って","買わない","買う"], correct:0, meaning:"මිලදී ගෙන (එන්න)" },
      { n:17, kaiwa:[{s:"男",t:"「セーシバ」と「スギシタ」どっちが使いやすいですか？"},{s:"女",t:"「セーシバ」のほうが使いやすいよ。"}], translation:"男: 'සේෂිබා' සහ 'සුගිෂිතා' අතරින් පාවිච්චි කරන්න ලේසි කුමක්ද?\n女: 'සේෂිබා' තමයි පාවිච්චි කරන්න ලේසි.", options:["と言います","と聞きます","と思います"], correct:2, meaning:"කියලා හිතනවා" },
      { n:18, kaiwa:[{s:"A",t:"ケティーさん、からい料理がすきですか？"},{s:"B",t:"はい、すきです。______、カレーとか、キムチとか"},{s:"A",t:"私もキムチが好きです。"}], translation:"A: කැටී, රස්නෙ කෑම වර්ග කැමතිද?\nB: ඔව්, කැමතියි. ______, කරි වගේ, කිම්චි වගේ.\nA: මමත් කිම්චි කැමතියි.", options:["たとえば","たしかに","とにかく"], correct:0, meaning:"උදාහරණයක් ලෙස" },
      { n:19, kaiwa:[{s:"A",t:"新しい仕事はどうですか？"},{s:"B",t:"たいへんです、______、がんばります。"}], translation:"A: අලුත් රැකියාව කොහොමද?\nB: අමාරුයි, ______, උත්සාහ කරනවා.", options:["できれば","でも","だけど"], correct:1, meaning:"නමුත්" },
      { n:20, kaiwa:[{s:"A",t:"昨日コピー機のスイッチは入ったまま"},{s:"B",t:"昨日はわすれてしまいました。"},{s:"A",t:"つぎは______きってくださいね。"}], translation:"A: ඊයේ කොපි මැෂිමේ ස්විචය දාපු විදිහටම තිබුණා.\nB: ඊයේ අමතක වුණා.\nA: ඊළඟට ______ (කරුණාකර) ස්විචය නිවන්න.", options:["かならず","すぐ","ときどき"], correct:0, meaning:"අනිවාර්යයෙන්ම" },
      { n:21, kaiwa:[{s:"A",t:"ダダンさん、朝はパンをたべますか。"},{s:"B",t:"はい、でもときどきご飯を______。"}], translation:"A: දඩාන් සමා, උදේට පාන් කනවද?\nB: ඔව්, ඒත් සමහර වෙලාවට බත් ______ (කනවා).", options:["みます","のみます","たべます"], correct:2, meaning:"කනවා" },
      { n:22, sentence:"ここでは、けいたいでんわを______でください。", translation:"මෙතන, ජංගම දුරකථනය ______ එපා (භාවිතා නොකරන්න).", options:["つかいました（使いました）","つかう（使う）","つかわない（使わない）"], correct:2, meaning:"පාවිච්චි කරන්නේ නැහැ" },
      { n:23, sentence:"まだ勉強していないので、明日のしけんは______です。", translation:"තාම පාඩම් කරලා නැති නිසා, හෙට විභාගය ගැන ______ (කනස්සල්ලයි).", options:["うれしい（嬉しい）","しんぱい（心配）","たのしい（楽しい）"], correct:1, meaning:"කනස්සල්ල" },
      { n:24, sentence:"かいぎはもうはじまったんですね、入ることはもう______。", translation:"රැස්වීම දැනටමත් පටන් අරන්, ඇතුල් වෙන්න දැන් ______ (බෑ ද)?", options:["ちょっとですか？","いちどですか？","むりですか？"], correct:2, meaning:"බෑ ද / කළ නොහැකිද" },
      { n:25, sentence:"かばんがおおきい、でも______です。", translation:"බෑගය ලොකුයි, ඒත් ______ (සැහැල්ලුයි).", options:["重い（おもい）","軽い（かるい）","強い（つよい）"], correct:1, meaning:"සැහැල්ලුයි" },
      { n:26, kaiwa:[{s:"女",t:"イルカさん、昼ご飯いっしょに______。"},{s:"男",t:"そう、しましょう。"}], translation:"女: ඉරුකා, දවල් කෑම එකට ______ (කන්නද)?\n男: ඔව්, කරමු.", options:["のみませんか？","たべませんでしたか？","たべませんか？"], correct:2, meaning:"කන්නද?" },
      { n:27, sentence:"好きな______は春です。", translation:"මම කැමතිම ______ (සෘතුව) වසන්තයයි.", options:["きせつ","きせき","きょうしつ"], correct:0, meaning:"සෘතුව" },
      { n:28, sentence:"______にごみをすててください。", translation:"______ (කුණු බඳුනට) කුණු දාන්න.", options:["ともだち","うち","ごみばこ"], correct:2, meaning:"කුණු බඳුන" },
      { n:29, kaiwa:[{s:"A",t:"やまださん、どうしましたか？"},{s:"B",t:"昨日から、のどがいたいんです。______"},{s:"A",t:"あたたかいお茶を飲んだほうがいいですよ。"}], translation:"A: යමදා, මොකද වුණේ?\nB: ඊයේ ඉඳලා, උගුරේ අමාරුවක්. ______\nA: උණුසුම් තේ බීමම හොඳයි.", options:["おめでとうございます","それはよかったですね","それはいけませんね"], correct:2, meaning:"ඒක අමාරුයි නේද" },
      { n:30, question:"うちにだれがいますか？", sentence:"うちに私と妻と______がいます。", translation:"ගෙදර කවුද ඉන්නේ?\nගෙදර මම, බිරිඳ සහ ______ (සුරතලා) ඉන්නවා.", options:["ボトル","ベード","ペット"], correct:2, meaning:"සුරතල් සතා" },
      { n:31, kaiwa:[{s:"A",t:"マリアさん、すてきなかばんですね"},{s:"B",t:"これですか？ 誕生日にともだちに______"}], translation:"A: මාරියා, බෑගය ලස්සනයි නේද.\nB: මේකද? උපන්දිනයට යාළුවෙක්ගෙන් ______ (ලැබුණා).", options:["もらいました","あげました","くれました"], correct:0, meaning:"ලැබුණා" },
      { n:32, kaiwa:[{s:"A",t:"すみません、コピー機の使い方をおしえていただけますか？"},{s:"B",t:"いいですよ。コピー機を______ ことがありますか？"}], translation:"A: සමාවෙන්න. photo copy machine එක පාවිච්චි කරන විදිහ කියලා දෙන්න පුළුවන්ද?\nB: හොඳයි. photo copy machine එක ______ (පාවිච්චි කරලා) තියෙනවද?", options:["使った","教えた","持った"], correct:0, meaning:"පාවිච්චි කළා" },
      { n:33, kaiwa:[{s:"A",t:"わかやまにおすすめところはどこですか？"},{s:"B",t:"わかやまなら（けんろくえん）がゆうめいですよ______行ってみてください"}], translation:"A: වකායමාහි නිර්දේශිත තැනක් මොකක්ද?\nB: වකායමා නම්, (කෙන්‍රොකුඑන්) ප්‍රසිද්ධයි. ______ ගිහින් බලන්න.", options:["たぶん","ぜんぜん","ぜひ"], correct:2, meaning:"අනිවාර්යයෙන්ම" },
      { n:34, question:"日本語はどうですか？", sentence:"前より、______ようになりました。", translation:"ජපන් භාෂාව කොහොමද?\nකලින්ට වඩා, ______ (කතා කරන්න පුළුවන්) වුණා.", options:["はなす","はなせる","はなし"], correct:1, meaning:"කතා කරන්න පුළුවන් වුණා" },
      { n:35, kaiwa:[{s:"A",t:"( ______ )"},{s:"B",t:"お疲れさまでした"}], translation:"A: ( ______ )\nB: වෙහෙස මහන්සි වුණා.", options:["さきにしつれいします","これからもよろしく","おめでとうございます"], correct:0, meaning:"මම කලින් යනවා (සමාවෙන්න)" },
      { n:36, kaiwa:[{s:"A",t:"さいきんかたがいたいです"},{s:"B",t:"私もです。かたをあたためるといいそうですよ。わたしは______、毎日おふろに入っています"}], translation:"A: මෑතකදී උරහිස රිදෙනවා.\nB: මටත් එහෙමයි. උරහිස රත් කිරීම හොඳයි කියලා ඇහුවා. මම ______ (හොඳ වෙන්න), හැම දාම නාන කාමරයට යනවා.", options:["よくならに","よくなるように","よくしたくて"], correct:1, meaning:"හොඳ වෙන්න වෙනුවෙන්" },
      { n:37, sentence:"（　）がいたいですから、ちょっとトイレにいきます。", translation:"බඩ රිදෙන නිසා, ටිකක් වැසිකිළියට යනවා.", options:["せなか","あたま","おなか"], correct:2, meaning:"බඩ" },
      { n:38, kaiwa:[{s:"A",t:"何を飲みますか"},{s:"B",t:"______を飲みますか"}], translation:"A: මොකක්ද බොන්නේ?\nB: ______ (කිරි) බොනවද?", options:["牛乳","牛肉","鶏肉"], correct:0, meaning:"කිරි" },
      { n:39, kaiwa:[{s:"A",t:"たべる前なんといいますか"},{s:"B",t:"______といいます"}], translation:"A: කන්න කලින් මොකද කියන්නේ?\nB: ______ කියනවා.", options:["ごちそうさまです","いただきます","よかった"], correct:1, meaning:"කන්න කලින් කියන ප්‍රණාමය" },
      { n:40, imageDesc:"ළමයෙක් copy machine එක අසල.", sentence:"コピー機を______？", translation:"කොපි මැෂිම ______ (පාවිච්චි කරනවද)?", options:["飲む","使う","食べます"], correct:1, meaning:"පාවිච්චි කරනවා" },
      { n:41, kaiwa:[{s:"A",t:"ごめんください"},{s:"B",t:"いらっしゃい、どうぞあがってください"}], translation:"A: කවුරුහරි ඉන්නවද?\nB: ආයුබෝවන්, කරුණාකර ඇතුලට එන්න.", options:["こちらこそ","よろしくお願いします","おじゃまします"], correct:2, meaning:"ඇතුල් වෙනකොට කියන වචනය" },
      { n:42, kaiwa:[{s:"A",t:"休みはいつからですか"},{s:"B",t:"来月の10日からです"},{s:"A",t:"休みの日はどこへいきますか"},{s:"B",t:"いいえ、______"}], translation:"A: නිවාඩුව කවදා ඉඳන්ද?\nB: ලබන මාසේ 10 වෙනිදා ඉඳන්.\nA: නිවාඩු දවසේ කොහෙද යන්නේ?\nB: නෑ, ______ (කොහෙවත් යන්නේ නැහැ).", options:["なにもいません","どこも行きません","だれもいません"], correct:1, meaning:"කොහෙවත් යන්නේ නැහැ" },
      { n:43, kaiwa:[{s:"A",t:"すみません、お願いします。"},{s:"B",t:"______"}], translation:"A: සමාවෙන්න, කරුණාකර.\nB: ______ (ඔව්).", options:["わかった","どうぞ","はい"], correct:2, meaning:"ඔව් / හරි" },
      { n:44, kaiwa:[{s:"A",t:"福岡へ行ったことがありますか？そこで美味しいラーメンがありますよ"},{s:"B",t:"まだです、行ったことがありません。"},{s:"A",t:"福岡へ______、食べてみてください"}], translation:"A: ෆුකුඕකාවලට ගිහින් තියෙනවද? එතන රසවත් රාමන් තියෙනවා.\nB: තාම නෑ, ගිහින් නෑ.\nA: ෆුකුඕකාවලට ______ (ගියොත්), කන්න බලන්න.", options:["着て","行ったら","来たら"], correct:1, meaning:"ගියොත් / ගිය පසු" },
      { n:45, kaiwa:[{s:"A",t:"夏は好きですか"},{s:"B",t:"夏は好きじゃない"},{s:"A",t:"どうしてですか"},{s:"B",t:"暑いのが______"}], translation:"A: ගිම්හානය කැමතිද?\nB: ගිම්හානය අකමැතියි.\nA: ඇයි?\nB: රස්නෙට ______ (අකමැතියි).", options:["涼しいですから","苦手ですから","楽しいですから"], correct:1, meaning:"අකමැතියි / දුර්වලයි" },
      { n:46, kaiwa:[{s:"A",t:"______この料理をたべてみてください"},{s:"B",t:"ありがとうございます、いただきます"}], translation:"A: ______ (කැමති නම්) මේ කෑම කන්න බලන්න.\nB: ස්තූතියි, කනවා.", options:["よかったら","ほんとう","できれば"], correct:0, meaning:"හොඳ නම් / කැමති නම්" },
      { n:47, sentence:"インドネシアに住んでいる______、インドネシア語を話したことがありません", translation:"ඉන්දුනීසියාවේ ජීවත් වුවත්, ඉන්දුනීසියානු භාෂාවෙන් කතා කරලා නෑ.", options:["のに","ので","のは"], correct:0, meaning:"වුවත් / කළත්" },
      { n:48, kaiwa:[{s:"A",t:"プラネタリウムにもう______"},{s:"B",t:"まだです"}], translation:"A: තාරකා විද්‍යාගාරයට දැනටමත් ______ (ගියාද)?\nB: තාම නෑ.", options:["料理ますか","買い物します","行きましたか"], correct:2, meaning:"ගියාද?" },
      { n:49, kaiwa:[{s:"A",t:"来週のパーティーのじゅんびは______"},{s:"B",t:"私は飲み物を持ってきます"}], translation:"A: ලබන සතියේ පාටියේ සූදානම ______ (මොකද කරන්නේ)?\nB: මම බීම වර්ග අරගෙන එනවා.", options:["どうしたんですか","どうしますか","どうですか"], correct:1, meaning:"මොකද කරන්නේ?" },
      { n:50, kaiwa:[{s:"A",t:"______注文したいんです"},{s:"B",t:"はい、なんですか"}], translation:"A: ______ (සමාවෙන්න), මට ඇණවුමක් කරන්න ඕන.\nB: ඔව්, මොකක්ද?", options:["どうぞ","お大事に","すみません"], correct:2, meaning:"සමාවෙන්න" },
      { n:51, imageDesc:"ළමයෙක් නව ඔරලෝසුවක් අතේ තියාගෙන සතුටින්.", kaiwa:[{s:"A",t:"新しい時計（とけい）を買（か）いました。"},{s:"B",t:"______"}], translation:"A: අලුත් ඔරලෝසුවක් ගත්තා.\nB: ______ (හැඩකාරයි)!", options:["悪い","かっこよかった","良い"], correct:1, meaning:"හැඩකාරයි වුණා" },
      { n:52, kaiwa:[{s:"A",t:"休みの日はどこへいきたいですか"},{s:"B",t:"おきなわにいきたいんですが"},{s:"A",t:"いいですね、すごくこみますから、_____ 早く行ったほうがいいです"}], translation:"A: නිවාඩු දවසේ කොහෙද යන්න කැමතිද?\nB: ඔකිනාවාවලට යන්න කැමතියි, ඒත්...\nA: හොඳයි, ගොඩක් තදබදයි නිසා, ______ ඉක්මනින් ගියොත් හොඳයි.", options:["できれば","かならず","できるだけ"], correct:0, meaning:"හැකි නම්" },
      { n:53, sentence:"駅に______、みんなで出発しましょう。", translation:"දුම්රිය ස්ථානයේ ______ (රැස්වෙලා), අපි එකට පිටත් වෙමු.", options:["あつまって","あつめて","あつまる"], correct:0, meaning:"රැස්වෙලා" },
      { n:54, sentence:"明日、学校に______。", translation:"හෙට, පාසලේ ______ (රැස්වෙනවා).", options:["あつまります","あつめます","あつまって"], correct:0, meaning:"රැස්වෙනවා" },
      { n:55, sentence:"______をはきます。", translation:"______ (කලිසම) අඳිනවා.", options:["ズボン","ぼうし","シャツ"], correct:0, meaning:"කලිසම" },
      { n:56, kaiwa:[{s:"A",t:"マリアさんのしゅみはなんですか。"},{s:"B",t:"わたしのしゅみはほんを………"},{s:"A",t:"しようせつですか。"},{s:"B",t:"それからときどきえいがもみます。"}], translation:"A: මාරියාගේ විනෝදාංශය මොකක්ද?\nB: මගේ විනෝදාංශය පොත් ______.\nA: නවකතාද?\nB: ඊට අමතරව සමහර වෙලාවට චිත්‍රපටත් බලනවා.", options:["きくことです","かくことです","よむことです"], correct:2, meaning:"කියවීම" },
      { n:57, kaiwa:[{s:"木村",t:"田中さん、………。顔色が悪いですよ。"},{s:"田中",t:"ええ、ちょっと頭が痛いんです。"}], translation:"木村: තනකා සමා, ______. මුහුණේ පාට හොඳ නැහැ.\n田中: ඔව්, ටිකක් හිස රිදෙනවා.", options:["はじめて","どうしたんですか","ごちそうさまでした"], correct:1, meaning:"මොකද වුණේ?" },
      { n:58, kaiwa:[{s:"佐藤",t:"ブディさん、今日で最後ですね。新天地でも頑張ってください。…………"},{s:"ブディ",t:"佐藤さん、今まで本当にありがとうございました。佐藤さんもお元気で。"}], translation:"佐藤: බුඩි සමා, අද අන්තිම දවසයි නේද. අලුත් තැනකත් උත්සාහ කරන්න. ______\nブディ: සතෝ සමා, මේ වෙනකම් ගොඩක් ස්තූතියි. සතෝ සමාත් සෞඛ්‍ය සම්පන්නව ඉන්න.", options:["いってらっしゃい、気をつけて","はじめまして、よろしくお願いします","お元気で、お世話になりました"], correct:2, meaning:"සුවයෙන් ඉන්න, බොහෝම ස්තූතියි" },
      { n:59, kaiwa:[{s:"山田",t:"ブディさん、たこ焼きの準備はもうできましたか。"},{s:"ブディ",t:"すみません、まだ …………"}], translation:"山田: බුඩි සමා, ටකෝයාකි සූදානම දැනටමත් ඉවරද?\nブディ: සමාවෙන්න, තාම ______ (ඉවර වෙලා නැහැ).", options:["わかりました","はじめます","おわっていません"], correct:2, meaning:"ඉවර වෙලා නැහැ" },
      { n:60, kaiwa:[{s:"ケン",t:"くり、くるしい…。あしがつった！ …………！"},{s:"ライフガード",t:"大変だ！今助けます！"}], translation:"ケン: කරි, අමාරුයි... කකුලට කැක්කුමක්! ______!\nライフガード: හරි බරපතලයි! දැන් උදව් කරන්නම්!", options:["どうぞ","おめでとう","たすけて"], correct:2, meaning:"උදව් කරන්න!" },
      { n:61, kaiwa:[{s:"山田",t:"田中さん、このお菓子、いかがですか。"},{s:"田中",t:"あ、ありがとうございます。でも、今お腹がいっぱいなので、…………"}], translation:"山田: තනකා සමා, මේ රසකැවිල්ල, කොහොමද?\n田中: ආහ්, ස්තූතියි. ඒත් දැන් බඩ පිරිලා තියෙන නිසා, ______ (ප්‍රතික්ෂේප කරනවා).", options:["いただきます","おねがいします","えんりょします"], correct:2, meaning:"ප්‍රතික්ෂේප කරනවා (ආචාරශීලීව එපා කියනවා)" },
      { n:62, kaiwa:[{s:"（同僚）",t:"山田さん、お疲れ様です。…………"},{s:"山田",t:"お疲れ様でした。気をつけて帰ってくださいね"}], translation:"（සගයා）: යමදා සමා, වෙහෙස මහන්සි වුණා. ______\n山田: වෙහෙස මහන්සි වුණා. පරිස්සමින් යන්න.", options:["おさきにしつれいします","いってきます","ただいま"], correct:0, meaning:"මම කලින් යනවා" },
      { n:63, kaiwa:[{s:"ブディ",t:"佐藤さん、それは ………… ハンカチですね。デザインも素敵です。"},{s:"佐藤",t:"ありがとうございます。汗をかくので、いつも綺麗なものを持っています。"}], translation:"ブディ: සතෝ සමා, ඒක ______ (පිරිසිදු) අත්පිස්නාවක් නේද. ඩිසයින් එකත් ලස්සනයි.\n佐藤: ස්තූතියි. දහඩිය දානවා නිසා, හැමවිටම පිරිසිදු දේවල් තියාගන්නවා.", options:["きたない","きれいな","からい"], correct:1, meaning:"පිරිසිදු" },
      { n:64, kaiwa:[{s:"おかあさん",t:"ごはんができましたよ。さあ、たべましょう。"},{s:"さくら",t:"わあ、おいしそう！ …………"}], translation:"おかあさん: බත් හදලා ඉවරයි. එන්න, කමු.\nさくら: වාව්, රසවත් වගේ! ______", options:["いってらっしゃい","ごちそうさまでした","いただきます"], correct:2, meaning:"කන්න කලින් කියන ප්‍රණාමය" },
      { n:65, kaiwa:[{s:"A",t:"あした、ピクニックに行きませんか。"},{s:"B",t:"いいですね。あめが …………？"},{s:"A",t:"あめがふったら、うちで映画を見ましょう。"}], translation:"A: හෙට, පිකිනික් යන්නද?\nB: හොඳයි. වහින්නෙ නැත්නම්...?\nA: වහිනවා නම්, ගෙදර ඉඳන් චිත්‍රපටයක් බලමු.", options:["ふるかもしれません","ふらないでください","ふったらどうしますか"], correct:2, meaning:"වහිනවා නම් මොකද කරන්නේ?" },
      { n:66, kaiwa:[{s:"A",t:"このコピーは…………。"},{s:"B",t:"はい、どうぞ。"},{s:"A",t:"ありがとうございます。"}], translation:"A: මේ කොපියේ ______ (පාවිච්චි කරන්න පුළුවන්ද)?\nB: ඔව්, කරන්න.\nA: ස්තූතියි.", options:["かりてもいいですか","つかってもいいですか","かしてもいいですか"], correct:1, meaning:"පාවිච්චි කරන්න පුළුවන්ද?" },
      { n:67, kaiwa:[{s:"女の人",t:"…………。"},{s:"男の人",t:"いいえ、大丈夫です。"}], translation:"女の人: ______ (සමාවෙන්න).\n男の人: නෑ, කමක් නෑ.", options:["かまいません","しつれいします","すみません"], correct:2, meaning:"සමාවෙන්න" },
      { n:68, kaiwa:[{s:"A",t:"食べ物はどうですか？"},{s:"B",t:"やっぱり、____。"}], translation:"A: කෑම කොහොමද?\nB: හැබැයි, ______ (රසවත් වුණා).", options:["おいしかった","たのしかった","かるかった"], correct:0, meaning:"රසවත් වුණා" },
      { n:69, kaiwa:[{s:"A",t:"にもつがおもそうですね、____________"},{s:"B",t:"ありがとうございます。"}], translation:"A: බඩුව බර වගේ නේද, ______ (උදව් කරන්නද)?\nB: ස්තූතියි.", options:["てつだいつづけますか？","てつだいましょうか？","てつだいます"], correct:1, meaning:"උදව් කරන්නද?" },
      { n:70, kaiwa:[{s:"A",t:"日曜日（にちようび）にさくら公園（こうえん）にお祭（まつ）りがあります。いっしょに行（い）きませんか？"},{s:"B",t:"それはいいですね。じゃあ、____________。"}], translation:"A: ඉරිදා සකුරා උද්‍යානයේ උත්සවයක් තියෙනවා. එකට යමුද?\nB: ඒක හොඳයි නේද. එහෙනම්, ______ (යමු).", options:["行きません","行きましょう","行きませんか？"], correct:1, meaning:"යමු" },
      { n:71, kaiwa:[{s:"A",t:"ケーキ、もう一つかがですか？"},{s:"B",t:"けっこうです。もう____________。"}], translation:"A: කේක් තව එකක් ගන්නවද?\nB: ඇති. දැනටමත් ______ (පිරිලා).", options:["すこしです","いっぱいです","いっかいです"], correct:1, meaning:"පිරිලා" },
      { n:72, kaiwa:[{s:"A",t:"この町（まち）には便利（べんり）______、いいところと思（おも）うよ。よかったら、案内（あんない）しましょうか？"},{s:"B",t:"本当（ほんとう）ですか？、ありがとうございます。"}], translation:"A: මේ නගරයේ පහසුකම් ______ (තියෙන එක), හොඳ තැනක් කියලා හිතනවා. හොඳ නම්, පෙන්නලා දෙන්නද?\nB: ඇත්තටම ද? ස්තූතියි.", options:["できれば","だったら","だけど"], correct:1, meaning:"නම් (කොන්දේසි)" },
      { n:73, kaiwa:[{s:"",t:"じしん（地震）あったとき、どうしますか？"},{s:"",t:"机（つくえ）の上に______。"}], translation:"භූමිකම්පාවක් වුණොත්, මොකද කරන්නේ?\nමේසයේ යටට ______ (හංගෙනවා).", options:["ちかづく","かくれる","はなれる"], correct:1, meaning:"හංගෙනවා" },
      { n:74, kaiwa:[{s:"A",t:"いらっしゃいませ。何（なに）がほしいですか？"},{s:"B",t:"バナナ、ふたふくろ______。"}], translation:"A: සාදරයෙන් පිළිගන්නවා. මොකක්ද ඕන?\nB: කෙසෙල්, බෑග් දෙකක් ______ (දෙන්න).", options:["ください","よろしく","どうぞ"], correct:0, meaning:"දෙන්න (කරුණාකර)" },
      { n:75, kaiwa:[{s:"A",t:"すみません、そのバナナ、見（み）せてくれませんか？"},{s:"B",t:"____________"}], translation:"A: සමාවෙන්න, ඒ කෙසෙල් පෙන්නන්න පුළුවන්ද?\nB: ______ (හොඳයි).", options:["そうですね","そうなんですか","いいですよ"], correct:2, meaning:"හොඳයි" },
      { n:76, kaiwa:[{s:"A",t:"それではこちらのフォームにごじゅうをお願いします。"},{s:"B",t:"はい、____________。"}], translation:"A: එහෙනම් මේ ෆෝරමයේ අත්සන කරන්න.\nB: හරි, ______ (මේකෙන් හරිද)?", options:["これでいいですか？","どうしてますか？","してますか？"], correct:0, meaning:"මේකෙන් හරිද?" },
      { n:77, kaiwa:[{s:"A",t:"外国（がいこく）の方（かた）のために、いろいろなサービスがあります。"},{s:"B",t:"へえ、そうですか、____________。"}], translation:"A: විදේශිකයන් වෙනුවෙන්, විවිධ සේවා තියෙනවා.\nB: ආහ්, එහෙමද, ______ (ප්‍රයෝජනවත්).", options:["いやになります","たすかります","大切（たいせつ）にします"], correct:1, meaning:"ප්‍රයෝජනවත් / ආධාරයක්" },
      { n:78, kaiwa:[{s:"A",t:"すみません、お風呂（おふろ）にシャンプーは______。"},{s:"B",t:"はい、ご自由（じゆう）にお使（つか）いください。"}], translation:"A: සමාවෙන්න, නාන කාමරයේ ෂැම්පු ______ (තියෙනවද)?\nB: ඔව්, කැමති විදිහට පාවිච්චි කරන්න.", options:["ありますか？","ちょっといいですか？","ついていますか？"], correct:0, meaning:"තියෙනවද?" },
      { n:79, sentence:"かっこいい時計をもらって、________。", translation:"හැඩකාර ඔරලෝසුවක් ලැබිලා, ______ (සතුටු වුණා).", options:["いそがしかったです","たのしかったです","うれしかったです"], correct:2, meaning:"සතුටු වුණා" },
      { n:80, sentence:"らいげつからテニスを ______ みよう。", translation:"ලබන මාසේ ඉඳන් ටෙනිස් ______ (පටන් ගෙන) බලමු.", options:["始めて","泳ぎて","来って"], correct:0, meaning:"පටන් ගෙන" },
      { n:81, sentence:"まいにちテレビを ______。", translation:"හැම දාම ටෙලිවිෂන් ______ (බලනවා).", options:["聞きます","見ます","読みます"], correct:1, meaning:"බලනවා" },
      { n:82, sentence:"メルアドでイベントについて友達 ______。", translation:"විද්‍යුත් තැපෑලෙන් උත්සවය ගැන යාළුවන්ට ______ (දැනුම් දෙනවා).", options:["さそいます","しらせます","おしえます"], correct:1, meaning:"දැනුම් දෙනවා" },
      { n:83, sentence:"体のけんこうのために ______ うんどうしたり", translation:"ශරීරයේ සෞඛ්‍යය වෙනුවෙන් ______ (දුවනවා) ව්‍යායාම කරලා", options:["歩いたり","走ったり","泳ぎたり"], correct:1, meaning:"දුවනවා" },
      { n:84, kaiwa:[{s:"A",t:"さとうさんおひさしぶり。"},{s:"B",t:"__________"}], translation:"A: සතෝ සමා, බොහෝ කාලෙකින් හමුවෙනවා.\nB: ______ (බොහෝ කාලෙකින්).", options:["そうですね","おかげさまで","おひさしぶり"], correct:2, meaning:"බොහෝ කාලෙකින්" },
      { n:85, kaiwa:[{s:"A",t:"よかったら、このテンプラはおいしいですよ。"},{s:"B",t:"すみません。アルレギーがあるのでエビを ______、体がかゆいです。"}], translation:"A: කැමති නම්, මේ ටෙම්පුරා රසයි.\nB: සමාවෙන්න. මට ඇලර්ජි එකක් තියෙන නිසා ඉස්සන් ______ (කෑවොත්), ශරීරය කසනවා.", options:["食べ過ぎ","食べ買った","食べると"], correct:2, meaning:"කෑවොත්" },
      { n:86, kaiwa:[{s:"B",t:"______ このあとでみんなといっしょにいくんです。"}], translation:"B: ______ (කැමති නම්), මේකෙන් පස්සේ හැමෝත් එකට යනවා.", options:["よかって","よかったら","よかった"], correct:1, meaning:"කැමති නම්" },
      { n:87, kaiwa:[{s:"A",t:"いい天気ですね。"},{s:"B",t:"______"}], translation:"A: කාලගුණය හොඳයි නේද.\nB: ______ (ඔව් නේද).", options:["そうですよ","そうですね","そうですか"], correct:1, meaning:"ඔව් නේද (එකඟත්වය)" },
      { n:88, kaiwa:[{s:"A",t:"キミさんはえいごが ______。"},{s:"B",t:"はい。少しできます。"}], translation:"A: කිමි සමාට ඉංග්‍රීසි ______ (පුළුවන්ද)?\nB: ඔව්. ටිකක් පුළුවන්.", options:["できますね","できますよ","できますか"], correct:2, meaning:"පුළුවන්ද? (ප්‍රශ්නය)" },
      { n:89, kaiwa:[{s:"A",t:"じこがあるので電車がうごかないんですが、動かないんです。"},{s:"B",t:"え…そうなんですか、________"}], translation:"A: අනතුරක් වුණ නිසා දුම්රිය ධාවනය වෙන්නේ නෑ.\nB: ආහ්...එහෙමද, ______ (මොකද කරන්නේ හොඳේ)?", options:["どうなんですか","そうですね","どうしたらいいですか"], correct:2, meaning:"මොකද කරන්නේ හොඳේ?" },
      { n:90, imageDesc:"වැඩිහිටි කාන්තාවක් කුඩා දරුවෙකු/බබෙකු සමඟ සිටින අතර, පිරිමි කෙනෙක් ඔවුන්ට යම් දෙයක් ලබාදෙන හෝ ඉඩ ලබාදෙන ආකාරයක් පෙන්වන රූපයකි.", kaiwa:[{s:"A",t:"__________"},{s:"B",t:"ありがとうございます。"}], translation:"A: ______ (කරුණාකර/ගන්න).\nB: ස්තූතියි.", options:["お大事に","どうぞ","すみません"], correct:1, meaning:"ගන්න / කරුණාකර" },
      { n:91, kaiwa:[{s:"A",t:"あのう。すみません。"},{s:"B",t:"はい、なんですか"},{s:"A",t:"このかんじの読み方を ______"}], translation:"A: ආ, සමාවෙන්න.\nB: ඔව්, මොකක්ද?\nA: මේ කන්ජිය කියවන විදිහ ______ (කියලා දෙන්න පුළුවන්ද)?", options:["教えてくださいませんか","教えてもらえませんか","教えてもいいですか"], correct:0, meaning:"කියලා දෙන්නද? (ආචාරශීලී ඉල්ලීම)" },
      { n:92, kaiwa:[{s:"A",t:"もしもし。今どこですか"},{s:"B",t:"今ゆべんきょうし ______。"}], translation:"A: හලෝ. දැන් කොහෙද ඉන්නේ?\nB: දැන් ඉගෙනගන්න තැනක ______ (ඉන්නවා).", options:["にあります","します","にいます"], correct:2, meaning:"ඉන්නවා" },
      { n:93, kaiwa:[{s:"A",t:"どんなほんですか"},{s:"B",t:"あおい本です。うちに名前が ______。"}], translation:"A: මොන වගේ පොතක්ද?\nB: නිල් පාට පොතක්. ගෙදර නම ______ (ලියලා තියෙනවා).", options:["かきます","かいています","かいてあります"], correct:2, meaning:"ලියලා තියෙනවා" },
      { n:94, kaiwa:[{s:"A",t:"アニさん、昨日は電気がついたままですよ。"},{s:"B",t:"ええ本当、すみません ______"}], translation:"A: අනි සමා, ඊයේ විදුලි බුබුළු දාපු විදිහටම තිබුණා.\nB: ආහ්, ඇත්තටම, සමාවෙන්න ______ (ලබන වතාවේ ඉඳන් පරිස්සම් වෙන්නම්).", options:["今度お願いします","今度からきをつけます","またこんど"], correct:1, meaning:"ලබන වතාවේ ඉඳන් පරිස්සම් වෙන්නම්" },
      { n:95, kaiwa:[{s:"A",t:"仕事はどうですか？"},{s:"B",t:"仕事は ______ 時間がありません。"}], translation:"A: රැකියාව කොහොමද?\nB: රැකියාව ______ (කාර්යබහුලයි), වෙලාවක් නෑ.", options:["いそがしい","いそがしくて","いそがし"], correct:1, meaning:"කාර්යබහුලයි" },
      { n:96, sentence:"メルアドでイベントについて友達 ______。", translation:"විද්‍යුත් තැපෑලෙන් උත්සවය ගැන යාළුවන්ට ______ (දැනුම් දෙනවා).", options:["さそいます","しらせます","おしえます"], correct:1, meaning:"දැනුම් දෙනවා" },
      { n:97, sentence:"らいげつからテニスを ______ みよう。", translation:"ලබන මාසේ ඉඳන් ටෙනිස් ______ (පටන් ගෙන) බලමු.", options:["始めて","泳ぎて","来って"], correct:0, meaning:"පටන් ගෙන" }
    ]
  },

      { n:12, page:12, imageDesc:"කිලිටි ඇඳුම් ඇඳගත් ළමයෙක්.", options:["よごれます","きれい","あそびます"], correct:0, meaning:"කිලිටි වෙනවා" },

      { n:14, page:14, imageDesc:"24 පැය convenience store එකක්.", options:["スーパー","デパート","コンビニ / コンビニエンスストア"], correct:2, meaning:"පැය 24ම විවෘත වෙළඳසැල" },
      { n:15, page:15, sentence:"明日、学校に______。", translation:"හෙට, පාසලේ ______ (රැස්වෙනවා).", options:["あつまります","あつめます","あつまって"], correct:0, meaning:"රැස්වෙනවා" },
      { n:16, page:16, sentence:"______をはきます。", translation:"______ (කලිසම) අඳිනවා.", options:["ズボン","ぼうし","シャツ"], correct:0, meaning:"කලිසම" },
      { n:17, page:17, imageDesc:"කැරට් කපන අතක්.", options:["きります（切ります）","むきます（剥きます）","きざみます（刻みます）"], correct:0, meaning:"කපනවා" },
      { n:18, page:18, sourceNote:"මෙම ප්‍රශ්නයේ රූපය/පාඨය මූලාශ්‍ර ගොනුවේ පැහැදිලි නැත (හිස් හෝ අඩු clarity) — [NOT CLEAR IN SOURCE]" },
      { n:19, page:19, kaiwa:[{s:"A",t:"マリアさんのしゅみはなんですか。"},{s:"B",t:"わたしのしゅみはほんを………"},{s:"A",t:"しようせつですか。"},{s:"B",t:"それからときどきえいがもみます。"}], translation:"A: මාරියාගේ විනෝදාංශය මොකක්ද?\nB: මගේ විනෝදාංශය පොත් ______.\nA: නවකතාද?\nB: ඊට අමතරව සමහර වෙලාවට චිත්‍රපටත් බලනවා.", options:["きくことです","かくことです","よむことです"], correct:2, meaning:"කියවීම" },
      { n:20, page:20, kaiwa:[{s:"木村",t:"田中さん、………。顔色が悪いですよ。"},{s:"田中",t:"ええ、ちょっと頭が痛いんです。"}], translation:"木村: තනකා සමා, ______. මුහුණේ පාට හොඳ නැහැ.\n田中: ඔව්, ටිකක් හිස රිදෙනවා.", options:["はじめて","どうしたんですか","ごちそうさまでした"], correct:1, meaning:"මොකද වුණේ?" },
      { n:21, page:21, kaiwa:[{s:"佐藤",t:"ブディさん、今日で最後ですね。新天地でも頑張ってください。…………"},{s:"ブディ",t:"佐藤さん、今まで本当にありがとうございました。佐藤さんもお元気で。"}], translation:"佐藤: බුඩි සමා, අද අන්තිම දවසයි නේද. අලුත් තැනකත් උත්සාහ කරන්න. ______\nブディ: සතෝ සමා, මේ වෙනකම් ගොඩක් ස්තූතියි. සතෝ සමාත් සෞඛ්‍ය සම්පන්නව ඉන්න.", options:["いってらっしゃい、気をつけて","はじめまして、よろしくお願いします","お元気で、お世話になりました"], correct:2, meaning:"සුවයෙන් ඉන්න, බොහෝම ස්තූතියි" },
      { n:22, page:22, kaiwa:[{s:"山田",t:"ブディさん、たこ焼きの準備はもうできましたか。"},{s:"ブディ",t:"すみません、まだ …………"}], translation:"山田: බුඩි සමා, ටකෝයාකි සූදානම දැනටමත් ඉවරද?\nブディ: සමාවෙන්න, තාම ______ (ඉවර වෙලා නැහැ).", options:["わかりました","はじめます","おわっていません"], correct:2, meaning:"ඉවර වෙලා නැහැ" },
      { n:23, page:23, kaiwa:[{s:"ケン",t:"くり、くるしい…。あしがつった！ …………！"},{s:"ライフガード",t:"大変だ！今助けます！"}], translation:"ケン: කරි, අමාරුයි... කකුලට කැක්කුමක්! ______!\nライフガード: හරි බරපතලයි! දැන් උදව් කරන්නම්!", options:["どうぞ","おめでとう","たすけて"], correct:2, meaning:"උදව් කරන්න!" },
      { n:24, page:24, kaiwa:[{s:"山田",t:"田中さん、このお菓子、いかがですか。"},{s:"田中",t:"あ、ありがとうございます。でも、今お腹がいっぱいなので、…………"}], translation:"山田: තනකා සමා, මේ රසකැවිල්ල, කොහොමද?\n田中: ආහ්, ස්තූතියි. ඒත් දැන් බඩ පිරිලා තියෙන නිසා, ______ (ප්‍රතික්ෂේප කරනවා).", options:["いただきます","おねがいします","えんりょします"], correct:2, meaning:"ප්‍රතික්ෂේප කරනවා (ආචාරශීලීව එපා කියනවා)" },
      { n:25, page:25, kaiwa:[{s:"（同僚）",t:"山田さん、お疲れ様です。…………"},{s:"山田",t:"お疲れ様でした。気をつけて帰ってくださいね"}], translation:"（සගයා）: යමදා සමා, වෙහෙස මහන්සි වුණා. ______\n山田: වෙහෙස මහන්සි වුණා. පරිස්සමින් යන්න.", options:["おさきにしつれいします","いってきます","ただいま"], correct:0, meaning:"මම කලින් යනවා" },
      { n:26, page:26, kaiwa:[{s:"ブディ",t:"佐藤さん、それは ………… ハンカチですね。デザインも素敵です。"},{s:"佐藤",t:"ありがとうございます。汗をかくので、いつも綺麗なものを持っています。"}], translation:"ブディ: සතෝ සමා, ඒක ______ (පිරිසිදු) අත්පිස්නාවක් නේද. ඩිසයින් එකත් ලස්සනයි.\n佐藤: ස්තූතියි. දහඩිය දානවා නිසා, හැමවිටම පිරිසිදු දේවල් තියාගන්නවා.", options:["きたない","きれいな","からい"], correct:1, meaning:"පිරිසිදු" },
      { n:27, page:27, kaiwa:[{s:"おかあさん",t:"ごはんができましたよ。さあ、たべましょう。"},{s:"さくら",t:"わあ、おいしそう！ …………"}], translation:"おかあさん: බත් හදලා ඉවරයි. එන්න, කමු.\nさくら: වාව්, රසවත් වගේ! ______", options:["いってらっしゃい","ごちそうさまでした","いただきます"], correct:2, meaning:"කන්න කලින් කියන ප්‍රණාමය" },
      { n:28, page:28, kaiwa:[{s:"A",t:"あした、ピクニックに行きませんか。"},{s:"B",t:"いいですね。あめが …………？"},{s:"A",t:"あめがふったら、うちで映画を見ましょう。"}], translation:"A: හෙට, පිකිනික් යන්නද?\nB: හොඳයි. වහින්නෙ නැත්නම්...?\nA: වහිනවා නම්, ගෙදර ඉඳන් චිත්‍රපටයක් බලමු.", options:["ふるかもしれません","ふらないでください","ふったらどうしますか"], correct:2, meaning:"වහිනවා නම් මොකද කරන්නේ?" },
      { n:29, page:29, kaiwa:[{s:"A",t:"このコピーは…………。"},{s:"B",t:"はい、どうぞ。"},{s:"A",t:"ありがとうございます。"}], translation:"A: මේ කොපියේ ______ (පාවිච්චි කරන්න පුළුවන්ද)?\nB: ඔව්, කරන්න.\nA: ස්තූතියි.", options:["かりてもいいですか","つかってもいいですか","かしてもいいですか"], correct:1, meaning:"පාවිච්චි කරන්න පුළුවන්ද?" }
    ]
  },
  "konpyuta-update": {
    title: "📄 KONPYUTA UPDATE",
    questions: [
      { n:1, page:1, imageDesc:"Desktop computer with monitor and keyboard.", options:["テレビ","キーボード","コンピューター"], correct:2, meaning:"පරිගණකය" },
      { n:2, page:2, imageDesc:"Person dropping a purple bag on the ground.", options:["おとします（落とします）","ひろいます（拾います）","おきます（置きます）"], correct:0, meaning:"වැටෙනවා / හෙළනවා" },
      { n:3, page:3, imageDesc:"Book with “HOUSE” written on it in a study room.", options:["かいてあります（書いてあります）","かきます（書きます）","よみます（読みます）"], correct:0, meaning:"ලියලා තියෙනවා" },
      { n:4, page:4, imageDesc:"Mother scolding a child who broke a window with a soccer ball.", options:["まよいます","しかります","わらいます"], correct:1, meaning:"බනිනවා (තරවටු කරනවා)" },
      { n:5, page:5, kaiwa:[{s:"女の人",t:"…………。"},{s:"男の人",t:"いいえ、大丈夫です。"}], translation:"女の人: ______ (සමාවෙන්න).\n男の人: නෑ, කමක් නෑ.", options:["かまいません","しつれいします","すみません"], correct:2, meaning:"සමාවෙන්න" },
      { n:6, page:6, imageDesc:"Boy drowning / calling for help in water.", options:["おります","わらいます","たすけます"], correct:2, meaning:"බේරා ගන්නවා / උදව් කරනවා" },
      { n:7, page:7, imageDesc:"Cartoon eyes.", options:["車","目","耳"], correct:1, meaning:"ඇස" },
      { n:8, page:8, imageDesc:"Doraemon backpack.", options:["すてきなバッグ","すてきなふく","すてきなふくろ"], correct:0, meaning:"ලස්සන බෑගය" },
      { n:9, page:9, imageDesc:"Human ear.", options:["耳","目","車"], correct:0, meaning:"කණ" },
      { n:10, page:10, sourceNote:"මෙම ප්‍රශ්නයේ අන්තර්ගතය (Extract continuing...) මූලාශ්‍ර ගොනුවේ පැහැදිලිව සපයා නොමැත — [NOT CLEAR IN SOURCE]" },
      { n:11, page:11, sentence:"私（わたし）のしゅみはえいがをみることです。", translation:"මගේ විනෝදාංශය චිත්‍රපට බැලීමයි.", options:["映画","映画館","計画"], correct:0, meaning:"චිත්‍රපටය" },
      { n:12, page:12, sentence:"私のくるまがうごかないです。", translation:"මගේ කාරය චලනය වෙන්නේ නැහැ.", options:["動かない","聞かない","泳がない"], correct:0, meaning:"චලනය වෙන්නේ නැහැ" },
      { n:13, page:13, sentence:"明日、たいふうがきます。外で出かけないで下さい。", translation:"හෙට, තුෆානයක් එනවා. පිටත යන්න එපා.", options:["風邪","風","台風"], correct:2, meaning:"සුළිසුළං" },
      { n:14, page:14, imageDesc:"Busy city street with many people and vehicles.", kaiwa:[{s:"A",t:"このまちは____です"},{s:"B",t:"そうですね。"}], translation:"A: මේ නගරය ______ (සජීවීයි) නේද.\nB: ඔව් නේද.", options:["にぎやか","ふべん","すくない"], correct:0, meaning:"සජීවී / ජනාකීර්ණ" },
      { n:15, page:15, kaiwa:[{s:"A",t:"食べ物はどうですか？"},{s:"B",t:"やっぱり、____。"}], translation:"A: කෑම කොහොමද?\nB: හැබැයි, ______ (රසවත් වුණා).", options:["おいしかった","たのしかった","かるかった"], correct:0, meaning:"රසවත් වුණා" },
      { n:16, page:16, kaiwa:[{s:"女の人",t:"____________。"},{s:"男の人",t:"いいえ、大丈夫です。"}], translation:"女の人: ______ (සමාවෙන්න).\n男の人: නෑ, කමක් නෑ.", options:["かまいません","しつれいします","すみません"], correct:2, meaning:"සමාවෙන්න" },
      { n:17, page:17, kaiwa:[{s:"A",t:"食べ物はどうですか？"},{s:"B",t:"____________"}], translation:"A: කෑම කොහොමද?\nB: ______ (රසවත් වුණා).", options:["すずしかった","おいしかった","たのしかった"], correct:1, meaning:"රසවත් වුණා" },
      { n:18, page:18, kaiwa:[{s:"A",t:"にもつがおもそうですね、____________"},{s:"B",t:"ありがとうございます。"}], translation:"A: බඩුව බර වගේ නේද, ______ (උදව් කරන්නද)?\nB: ස්තූතියි.", options:["てつだいつづけますか？","てつだいましょうか？","てつだいます"], correct:1, meaning:"උදව් කරන්නද?" },
      { n:19, page:19, kaiwa:[{s:"A",t:"日曜日（にちようび）にさくら公園（こうえん）にお祭（まつ）りがあります。いっしょに行（い）きませんか？"},{s:"B",t:"それはいいですね。じゃあ、____________。"}], translation:"A: ඉරිදා සකුරා උද්‍යානයේ උත්සවයක් තියෙනවා. එකට යමුද?\nB: ඒක හොඳයි නේද. එහෙනම්, ______ (යමු).", options:["行きません","行きましょう","行きませんか？"], correct:1, meaning:"යමු" },
      { n:20, page:20, kaiwa:[{s:"A",t:"ケーキ、もう一つかがですか？"},{s:"B",t:"けっこうです。もう____________。"}], translation:"A: කේක් තව එකක් ගන්නවද?\nB: ඇති. දැනටමත් ______ (පිරිලා).", options:["すこしです","いっぱいです","いっかいです"], correct:1, meaning:"පිරිලා" },
      { n:21, page:21, kaiwa:[{s:"A",t:"この町（まち）には便利（べんり）______、いいところと思（おも）うよ。よかったら、案内（あんない）しましょうか？"},{s:"B",t:"本当（ほんとう）ですか？、ありがとうございます。"}], translation:"A: මේ නගරයේ පහසුකම් ______ (තියෙන එක), හොඳ තැනක් කියලා හිතනවා. හොඳ නම්, පෙන්නලා දෙන්නද?\nB: ඇත්තටම ද? ස්තූතියි.", options:["できれば","だったら","だけど"], correct:1, meaning:"නම් (කොන්දේසි)" },
      { n:22, page:22, kaiwa:[{s:"",t:"じしん（地震）あったとき、どうしますか？"},{s:"",t:"机（つくえ）の上に______。"}], translation:"භූමිකම්පාවක් වුණොත්, මොකද කරන්නේ?\nමේසයේ යටට ______ (හංගෙනවා).", options:["ちかづく","かくれる","はなれる"], correct:1, meaning:"හංගෙනවා" },
      { n:23, page:23, kaiwa:[{s:"A",t:"いらっしゃいませ。何（なに）がほしいですか？"},{s:"B",t:"バナナ、ふたふくろ______。"}], translation:"A: සාදරයෙන් පිළිගන්නවා. මොකක්ද ඕන?\nB: කෙසෙල්, බෑග් දෙකක් ______ (දෙන්න).", options:["ください","よろしく","どうぞ"], correct:0, meaning:"දෙන්න (කරුණාකර)" },
      { n:24, page:24, kaiwa:[{s:"A",t:"すみません、そのバナナ、見（み）せてくれませんか？"},{s:"B",t:"____________"}], translation:"A: සමාවෙන්න, ඒ කෙසෙල් පෙන්නන්න පුළුවන්ද?\nB: ______ (හොඳයි).", options:["そうですね","そうなんですか","いいですよ"], correct:2, meaning:"හොඳයි" },

/* ============ STATE ============ */
let currentPaperId = "orimasu-update";
let currentIndex = 0;
let userState = {}; // per-paper: { qIndex: { selected, translated } }
let readingIndex = 0;

function getPaper(){ return papers[currentPaperId]; }
function getQuestions(){ return getPaper().questions; }
function ensurePaperState(){
  if(!userState[currentPaperId]) userState[currentPaperId] = {};
  return userState[currentPaperId];
}

/* ============ RENDER: PAPER SELECTOR ============ */
function renderPaperBar(){
  const bar = document.getElementById('paperBar');
  bar.innerHTML = '';
  Object.keys(papers).forEach(id=>{
    const chip = document.createElement('div');
    chip.className = 'paper-chip' + (id===currentPaperId ? ' active' : '');
    chip.textContent = papers[id].title.replace('📄 ','');
    chip.onclick = ()=>{ if(id!==currentPaperId){ currentPaperId=id; currentIndex=0; renderPaperBar(); renderAll(); } };
    bar.appendChild(chip);
  });
  const addChip = document.createElement('div');
  addChip.className = 'paper-chip add';
  addChip.textContent = '+ Add Paper';
  addChip.onclick = ()=> alert('To add a new paper, provide its extracted TXT content and it will be added here as a new selectable paper with its own automatically-calculated question count.');
  bar.appendChild(addChip);
}

/* ============ RENDER: HEADER ============ */
function renderHeader(){
  const qs = getQuestions();
  document.getElementById('paperName').textContent = getPaper().title;
  const shownIndex = Math.min(currentIndex+1, qs.length);
  document.getElementById('qCounter').textContent = `Question ${shownIndex} / ${qs.length}`;
  const pct = Math.min(100, (shownIndex/qs.length)*100);
  document.getElementById('progressFill').style.width = pct + '%';
}

/* ============ RENDER: QUESTION / COMPLETION ============ */
function renderAll(){
  renderHeader();
  const qs = getQuestions();
  const area = document.getElementById('quizArea');
  area.innerHTML = '';

  if(currentIndex >= qs.length){
    renderCompletion(area);
    return;
  }

  const q = qs[currentIndex];
  const state = ensurePaperState();
  const qState = state[currentIndex] || { selected:null, translated:false };
  state[currentIndex] = qState;

  const card = document.createElement('div');
  card.className = 'card';

  // meta
  const meta = document.createElement('div');
  meta.className = 'q-meta';
  meta.innerHTML = `<span class="badge">Q${q.n}</span>` + (q.page ? `<span>Source Page ${q.page}</span>` : '');
  card.appendChild(meta);

  // image description
  if(q.imageDesc){
    const img = document.createElement('div');
    img.className = 'img-desc si';
    img.innerHTML = `<span class="label jp" style="font-family:Inter,sans-serif;">රූප විස්තරය</span>${escapeHtml(q.imageDesc)}`;
    card.appendChild(img);
  }

  // source note (e.g. kaiwa text missing from source file)
  if(q.sourceNote){
    const note = document.createElement('div');
    note.className = 'img-desc si';
    note.style.borderColor = '#F0C36D';
    note.style.background = '#FFF8EC';
    note.innerHTML = `<span class="label" style="color:#B8860B;">Source Note</span>${escapeHtml(q.sourceNote)}`;
    card.appendChild(note);
  }

  // plain question line (non-kaiwa)
  if(q.question){
    const qline = document.createElement('div');
    qline.className = 'q-sentence jp';
    qline.innerHTML = formatBlank(q.question);
    card.appendChild(qline);
  }
  if(q.sentence){
    const sline = document.createElement('div');
    sline.className = 'q-sentence jp';
    sline.innerHTML = formatBlank(q.sentence);
    card.appendChild(sline);
  }

  // full kaiwa
  if(q.kaiwa){
    const kaiwaWrap = document.createElement('div');
    kaiwaWrap.className = 'kaiwa';
    q.kaiwa.forEach((line, i)=>{
      const row = document.createElement('div');
      const side = (i % 2 === 0) ? 'left' : 'right';
      row.className = 'bubble-row ' + side;
      const bubble = document.createElement('div');
      bubble.className = 'bubble jp';
      bubble.innerHTML = `<span class="speaker">${escapeHtml(line.s)}</span>${formatBlank(line.t)}`;
      row.appendChild(bubble);
      kaiwaWrap.appendChild(row);
    });
    card.appendChild(kaiwaWrap);
  }

  // translate button + box (only if there's Japanese text to translate)
  if(q.kaiwa || q.sentence || q.question){
    const tBtn = document.createElement('button');
    tBtn.className = 'translate-btn';
    tBtn.innerHTML = '🌐 Translate';
    const tBox = document.createElement('div');
    tBox.className = 'translation-box si' + (qState.translated ? ' show' : '');
    const transText = (q.translation || '').split('\n').map(escapeHtml).join('<br>');
    tBox.innerHTML = `<span class="label">Sinhala</span>${transText}`;
    tBtn.onclick = ()=>{
      qState.translated = !qState.translated;
      tBox.classList.toggle('show', qState.translated);
    };
    card.appendChild(tBtn);
    card.appendChild(tBox);
  }

  // options
  if(q.options && q.options.length){
    const optsWrap = document.createElement('div');
    optsWrap.className = 'options';
    const letters = ['A','B','C','D','E'];
    q.options.forEach((opt, idx)=>{
      const btn = document.createElement('button');
      btn.className = 'opt-btn jp';
      btn.innerHTML = `<span class="opt-letter">${letters[idx]||(idx+1)}</span><span>${escapeHtml(opt)}</span>`;
      if(qState.selected !== null && qState.selected !== undefined){
        btn.disabled = true;
        if(idx === q.correct) btn.classList.add('correct');
        if(idx === qState.selected && idx !== q.correct) btn.classList.add('wrong');
      }
      btn.onclick = ()=>{
        if(qState.selected !== null && qState.selected !== undefined) return;
        qState.selected = idx;
        renderAll();
      };
      optsWrap.appendChild(btn);
    });
    card.appendChild(optsWrap);
  }

  // result area
  if(q.options && q.options.length){
    const resultArea = document.createElement('div');
    resultArea.className = 'result-area' + (qState.selected !== null && qState.selected !== undefined ? ' show' : '');
    if(qState.selected !== null && qState.selected !== undefined){
      const isCorrect = qState.selected === q.correct;
      const banner = document.createElement('div');
      banner.className = 'result-banner ' + (isCorrect ? 'ok' : 'no') + ' si';
      banner.textContent = isCorrect ? '✅ හරි උත්තරය!' : '❌ වැරදියි';
      resultArea.appendChild(banner);

      const reveal = document.createElement('div');
      reveal.className = 'answer-reveal';
      reveal.innerHTML = `
        <div class="row">
          <span class="label si">හරි උත්තරය</span>
          <span class="jp-ans jp">${escapeHtml(q.options[q.correct])}</span>
        </div>
        <div class="row">
          <span class="label si">සිංහල තේරුම</span>
          <span class="jp-ans si">${escapeHtml(q.meaning || '')}</span>
        </div>`;
      resultArea.appendChild(reveal);
    }
    card.appendChild(resultArea);
  }

  area.appendChild(card);

  // nav
  const nav = document.createElement('div');
  nav.className = 'nav-row';
  const prevBtn = document.createElement('button');
  prevBtn.className = 'nav-btn prev';
  prevBtn.textContent = '← Previous';
  prevBtn.disabled = currentIndex === 0;
  prevBtn.onclick = ()=>{ if(currentIndex>0){ currentIndex--; renderAll(); } };

  const nextBtn = document.createElement('button');
  nextBtn.className = 'nav-btn next';
  nextBtn.textContent = 'Next →';
  nextBtn.onclick = ()=>{ currentIndex++; renderAll(); };

  nav.appendChild(prevBtn);
  nav.appendChild(nextBtn);
  area.appendChild(nav);
}

function getQuestionText(q){
  if(q.sentence) return q.sentence;
  if(q.question) return q.question;
  if(q.kaiwa) return q.kaiwa.map(l=> (l.s ? `${l.s}：` : '') + l.t).join('  /  ');
  if(q.imageDesc) return q.imageDesc;
  return `Q${q.n}`;
}

function copyTextToClipboard(text, btn){
  const done = ()=>{
    if(!btn) return;
    const original = btn.dataset.label || btn.textContent;
    btn.dataset.label = original;
    btn.textContent = '✅ Copied!';
    btn.classList.add('copied');
    setTimeout(()=>{ btn.textContent = original; btn.classList.remove('copied'); }, 1600);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>{ fallbackCopy(text); done(); });
  } else {
    fallbackCopy(text);
    done();
  }
}
function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.className = 'copy-textarea';
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
}

function renderCompletion(area){
  const qs = getQuestions();
  const state = ensurePaperState();
  const paperTitle = getPaper().title.replace('📄 ','');
  let correctCount = 0;
  const wrongQs = [];
  qs.forEach((q,i)=>{
    const sel = state[i] ? state[i].selected : undefined;
    if(sel === q.correct){ correctCount++; }
    else if(sel !== null && sel !== undefined){ wrongQs.push({q, sel}); }
  });

  const card = document.createElement('div');
  card.className = 'card complete-card';
  card.innerHTML = `
    <div class="emoji">🎉</div>
    <h2>Completed!</h2>
    <p>You completed all ${qs.length} questions in this paper.</p>
    <div class="score-pill">${correctCount} / ${qs.length} correct</div>
    <br>
    <button class="restart-btn" id="restartBtn">Restart Paper</button>
  `;

  /* ---- Wrong answers section ---- */
  const wrongSection = document.createElement('div');
  wrongSection.className = 'review-section';
  const wrongHead = document.createElement('div');
  wrongHead.className = 'review-head';
  wrongHead.innerHTML = `<div class="review-title si">❌ වැරදුණු ප්‍රශ්න (${wrongQs.length})</div>`;
  const wrongCopyBtn = document.createElement('button');
  wrongCopyBtn.className = 'copy-btn si';
  wrongCopyBtn.textContent = '📋 Copy';
  wrongHead.appendChild(wrongCopyBtn);
  wrongSection.appendChild(wrongHead);

  if(wrongQs.length === 0){
    const empty = document.createElement('div');
    empty.className = 'review-empty si';
    empty.textContent = '🎊 සියලුම ප්‍රශ්නවලට හරි උත්තර දීලා තියෙනවා!';
    wrongSection.appendChild(empty);
    wrongCopyBtn.style.display = 'none';
  } else {
    const list = document.createElement('div');
    list.className = 'review-list';
    wrongQs.forEach(({q, sel})=>{
      const item = document.createElement('div');
      item.className = 'review-item wrong';
      item.innerHTML = `
        <span class="q-label">Q${q.n}</span>
        <div class="q-text jp">${escapeHtml(getQuestionText(q))}</div>
        <div class="row wrong-ans si"><span class="tag">ඔබ දුන්නා</span><span class="jp">${escapeHtml(q.options[sel])}</span></div>
        <div class="row correct-ans si"><span class="tag">හරි උත්තරය</span><span class="jp">${escapeHtml(q.options[q.correct])}</span></div>
        <div class="row meaning-si si"><span class="tag">තේරුම</span>${escapeHtml(q.meaning || '')}</div>
      `;
      list.appendChild(item);
    });
    wrongSection.appendChild(list);

    wrongCopyBtn.onclick = ()=>{
      let text = `${paperTitle} — වැරදුණු ප්‍රශ්න (${wrongQs.length})\n\n`;
      wrongQs.forEach(({q, sel})=>{
        text += `Q${q.n}: ${getQuestionText(q)}\n`;
        text += `ඔබ දුන්නා: ${q.options[sel]}\n`;
        text += `හරි උත්තරය: ${q.options[q.correct]}\n`;
        text += `තේරුම: ${q.meaning || ''}\n\n`;
      });
      copyTextToClipboard(text.trim(), wrongCopyBtn);
    };
  }

  /* ---- Full answer key section ---- */
  const keySection = document.createElement('div');
  keySection.className = 'review-section';
  const keyHead = document.createElement('div');
  keyHead.className = 'review-head';
  keyHead.innerHTML = `<div class="review-title si">📑 සියලුම උත්තර (Answer Key)</div>`;
  const keyCopyBtn = document.createElement('button');
  keyCopyBtn.className = 'copy-btn si';
  keyCopyBtn.textContent = '📋 Copy';
  keyHead.appendChild(keyCopyBtn);
  keySection.appendChild(keyHead);

  const keyList = document.createElement('div');
  keyList.className = 'review-list';
  qs.forEach(q=>{
    const item = document.createElement('div');
    item.className = 'review-item';
    item.innerHTML = `
      <span class="q-label">Q${q.n}</span>
      <div class="q-text jp">${escapeHtml(getQuestionText(q))}</div>
      <div class="row correct-ans si"><span class="tag">හරි උත්තරය</span><span class="jp">${escapeHtml(q.options[q.correct])}</span></div>
      <div class="row meaning-si si"><span class="tag">තේරුම</span>${escapeHtml(q.meaning || '')}</div>
    `;
    keyList.appendChild(item);
  });
  keySection.appendChild(keyList);

  keyCopyBtn.onclick = ()=>{
    let text = `${paperTitle} — සියලුම උත්තර (Answer Key)\n\n`;
    qs.forEach(q=>{
      text += `Q${q.n}: ${getQuestionText(q)}\n`;
      text += `හරි උත්තරය: ${q.options[q.correct]}\n`;
      text += `තේරුම: ${q.meaning || ''}\n\n`;
    });
    copyTextToClipboard(text.trim(), keyCopyBtn);
  };

  card.appendChild(wrongSection);
  card.appendChild(keySection);
  area.appendChild(card);

  document.getElementById('restartBtn').onclick = ()=>{
    userState[currentPaperId] = {};
    currentIndex = 0;
    renderAll();
  };

  const nav = document.createElement('div');
  nav.className = 'nav-row';
  const prevBtn = document.createElement('button');
  prevBtn.className = 'nav-btn prev';
  prevBtn.textContent = '← Previous';
  prevBtn.onclick = ()=>{ currentIndex = qs.length - 1; renderAll(); };
  nav.appendChild(prevBtn);
  area.appendChild(nav);
}

/* ============ HELPERS ============ */
function escapeHtml(str){
  return String(str)
    .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
}
function formatBlank(str){
  return escapeHtml(str).replaceAll(/_{2,}/g, m => `<span class="blank">&nbsp;</span>`);
}

/* ============ RENDER: READING NOTES ============ */
function renderReading(){
  const view = document.getElementById('readingView');
  view.innerHTML = '';

  if(readingIndex < 0) readingIndex = 0;
  if(readingIndex > readingNotes.length - 1) readingIndex = readingNotes.length - 1;

  const shell = document.createElement('div');
  shell.className = 'reading-shell';

  // header (title + counter + progress bar), same pattern as the quiz header
  const headerCard = document.createElement('div');
  headerCard.className = 'header-card';
  const pct = ((readingIndex+1)/readingNotes.length)*100;
  headerCard.innerHTML = `
    <div class="header-top">
      <div class="paper-name">📖 GRAMMAR NOTES (Reading)</div>
      <div class="q-counter">Note ${readingIndex+1} / ${readingNotes.length}</div>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
  `;
  shell.appendChild(headerCard);

  const intro = document.createElement('div');
  intro.className = 'reading-title-card';
  intro.innerHTML = `📖 Kaiwa & Sinhala Meaning
    <small class="si">මේවා ප්‍රශ්න නොවේ, කියවීම සඳහා පමණි — Kaiwa එක සහ සිංහල තේරුම එකට බලාගන්න.</small>`;
  shell.appendChild(intro);

  const note = readingNotes[readingIndex];
  const card = document.createElement('div');
  card.className = 'rnote-card';

  if(note.id){
    const idEl = document.createElement('div');
    idEl.className = 'rnote-id';
    idEl.textContent = note.id;
    card.appendChild(idEl);
  }

  if(note.scenario){
    const sc = document.createElement('div');
    sc.className = 'rnote-scenario si';
    sc.innerHTML = `<span class="label" style="font-family:Inter,sans-serif;">රූප/ප්‍රශ්න විස්තරය</span>${escapeHtml(note.scenario)}`;
    card.appendChild(sc);
  }

  note.lines.forEach(line=>{
    const lWrap = document.createElement('div');
    lWrap.className = 'rline';
    let html = '';
    if(line.s){ html += `<div class="rspeaker">${escapeHtml(line.s)}</div>`; }
    html += `<div class="rjp jp">${escapeHtml(line.jp)}</div>`;
    if(line.ro){ html += `<div class="rromaji">${escapeHtml(line.ro)}</div>`; }
    if(line.si){ html += `<div class="rsi si">${escapeHtml(line.si)}</div>`; }
    lWrap.innerHTML = html;
    card.appendChild(lWrap);
  });

  if(note.notes && note.notes.length){
    const extra = document.createElement('div');
    extra.className = 'rnote-extra si';
    extra.innerHTML = `<span class="label">සටහන</span>${note.notes.map(escapeHtml).join('<br>')}`;
    card.appendChild(extra);
  }

  shell.appendChild(card);

  // nav
  const nav = document.createElement('div');
  nav.className = 'nav-row';
  const prevBtn = document.createElement('button');
  prevBtn.className = 'nav-btn prev';
  prevBtn.textContent = '← Previous';
  prevBtn.disabled = readingIndex === 0;
  prevBtn.onclick = ()=>{ if(readingIndex>0){ readingIndex--; renderReading(); } };

  const nextBtn = document.createElement('button');
  nextBtn.className = 'nav-btn next';
  nextBtn.textContent = 'Next →';
  nextBtn.disabled = readingIndex === readingNotes.length - 1;
  nextBtn.onclick = ()=>{ if(readingIndex < readingNotes.length - 1){ readingIndex++; renderReading(); } };

  nav.appendChild(prevBtn);
  nav.appendChild(nextBtn);
  shell.appendChild(nav);

  view.appendChild(shell);
}

/* ============ RENDER: KANJI LIST (auto-built from all papers) ============ */
const KANJI_REGEX = /[\u4E00-\u9FFF\u3400-\u4DBF]/;

function collectKanjiEntries(){
  // Walks the live `papers` object every time it's called, so adding a new
  // paper to `papers` later makes it show up here automatically.
  const map = new Map();
  Object.keys(papers).forEach(pid=>{
    const paper = papers[pid];
    const paperTitle = paper.title.replace('📄 ','');
    paper.questions.forEach(q=>{
      if(!q.options || typeof q.correct !== 'number') return;
      const word = q.options[q.correct];
      if(!word || !KANJI_REGEX.test(word)) return;
      if(!map.has(word)){
        map.set(word, { word, meaning: q.meaning || '', paperTitle, qn: q.n });
      }
    });
  });
  return Array.from(map.values()).sort((a,b)=> a.word.localeCompare(b.word,'ja'));
}

function renderKanjiList(container){
  const entries = collectKanjiEntries();

  const shell = document.createElement('div');
  shell.className = 'kanji-shell';

  const intro = document.createElement('div');
  intro.className = 'kanji-title-card';
  intro.innerHTML = `🈶 සියලුම Kanji (Auto-collected)
    <small class="si">Paper ඕනම එකකට අදාළ ප්‍රශ්නවල හරි උත්තරයේ තියෙන kanji වචන ${entries.length}ක් මෙතන පෙන්නනවා — සිංහල තේරුමත් එක්ක. අලුත් paper එකක් add කළාම, මේ list එකත් auto-update වෙනවා.</small>`;
  shell.appendChild(intro);

  const toolbar = document.createElement('div');
  toolbar.className = 'kanji-toolbar';
  const copyBtn = document.createElement('button');
  copyBtn.className = 'copy-btn si';
  copyBtn.textContent = '📋 Copy All';
  copyBtn.onclick = ()=>{
    let text = `සියලුම Kanji (${entries.length})\n\n`;
    entries.forEach(e=>{
      text += `${e.word}\n`;
      text += `තේරුම: ${e.meaning}\n`;
      text += `මූලාශ්‍රය: ${e.paperTitle} (Q${e.qn})\n\n`;
    });
    copyTextToClipboard(text.trim(), copyBtn);
  };
  toolbar.appendChild(copyBtn);
  shell.appendChild(toolbar);

  if(entries.length === 0){
    const empty = document.createElement('div');
    empty.className = 'review-empty si';
    empty.textContent = 'තවම kanji අඩංගු ප්‍රශ්න හමු වුනේ නැහැ.';
    shell.appendChild(empty);
  } else {
    const list = document.createElement('div');
    list.className = 'kanji-list';
    entries.forEach(e=>{
      const item = document.createElement('div');
      item.className = 'kanji-item';
      item.innerHTML = `
        <div class="word jp">${escapeHtml(e.word)}</div>
        <div class="meaning si">${escapeHtml(e.meaning)}</div>
        <div class="source">${escapeHtml(e.paperTitle)} · Q${e.qn}</div>
      `;
      list.appendChild(item);
    });
    shell.appendChild(list);
  }

  container.appendChild(shell);
}

function shuffleArray(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function initKanjiExam(){
  examOrder = shuffleArray(kanjiExamData.map((_, i) => i));
  examIndex = 0;
  examAnswers = {};
  examRevealed = false;
}
