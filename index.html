function getSimilarKanjiForExam(word){
  const chars = [...word].filter(c => /[\u3400-\u9FFF]/.test(c));
  if(!chars.length) return [];

  // Show the FULL Kanji entry/word from the existing database,
  // not only the matching single character.
  const relatedWords = [];
  const seen = new Set();

  kanjiExamData.forEach((entry) => {
    if(!entry || !entry.kanji || entry.kanji === word) return;

    const entryChars = [...entry.kanji].filter(c => /[\u3400-\u9FFF]/.test(c));
    let related = false;

    chars.forEach(ch => {
      // Same visual/component group
      kanjiVisualGroups.forEach(group => {
        if(group.includes(ch) && entryChars.some(c => group.includes(c) && c !== ch)){
          related = true;
        }
      });

      // Same character appearing in another database word
      if(entry.kanji.includes(ch)){
        related = true;
      }
    });

    if(related && !seen.has(entry.kanji)){
      seen.add(entry.kanji);
      relatedWords.push({
        word: entry.kanji,
        reading: entry.reading || '',
        meaning: entry.meaning || ''
      });
    }
  });

  return relatedWords.slice(0,8);
}

function readingForChar(entry, ch){
  // For compound entries, keep the full reading only when it is a single-kanji entry.
  const exact = kanjiExamData.find(e => e.kanji === ch);
  if(exact && exact.reading) return exact.reading;
  return '';
}

function renderKanjiExamCard(container){
  const entryIdx = examOrder[examIndex];
  const entry = kanjiExamData[entryIdx];

  const card = document.createElement('div');
  card.className = 'exam-card';

  let inner = `<div class="exam-progress">Q ${examIndex + 1} / ${examOrder.length}</div>`;
  inner += `<div class="exam-kanji-big jp">${escapeHtml(entry.kanji)}</div>`;
  if(examRevealed){
    inner += `<div class="exam-answer-box">`;
    if(entry.reading){ inner += `<div class="exam-reading jp">${escapeHtml(entry.reading)}</div>`; }
    inner += `<div class="exam-meaning si">${escapeHtml(entry.meaning)}</div>`;

    // Exam-only memory aid: show Kanji that use the same visual/component character.
    const similar = getSimilarKanjiForExam(entry.kanji);
    if(similar.length){
      inner += `<div class="exam-similar">`;
      inner += `<div class="exam-similar-title si">🧠 මේ වගේ Kanji — මතක තියාගන්න ලේසි වෙන්න</div>`;
      inner += `<div class="exam-similar-row">`;
      similar.forEach(e=>{
        inner += `<div class="exam-similar-item">`;
        inner += `<div class="exam-similar-kanji jp">${escapeHtml(e.word)}</div>`;

      });

    }

  card.innerHTML = inner;

/* ---- Multiple-choice Kanji Exam (4 options, auto-graded) ---- */
let mcqOrder = [];
let mcqIndex = 0;
let mcqAnswers = {};
let mcqStates = []; // per-question generated options, parallel to mcqOrder

function initKanjiMcq(){
  mcqOrder = shuffleArray(kanjiExamData.map((_, i) => i));
  mcqIndex = 0;
  mcqAnswers = {};
  mcqStates = [];
}

function buildKanjiMcqOptions(entryIdx){
  const entry = kanjiExamData[entryIdx];
  // Full display text: hiragana - sinhala
  const makeLabel = (e) => {
    const r = e.reading || '';
    const m = e.meaning || '';
    if(r && m) return r + ' - ' + m;
    return r || m || '';
  };
  const correctLabel = makeLabel(entry);
  let pool = [];
  kanjiExamData.forEach((e, i)=>{
    if(i === entryIdx) return;
    const label = makeLabel(e);
    if(label && label !== correctLabel) pool.push(label);
  });
  pool = shuffleArray(pool);
  const seen = new Set([correctLabel]);
  const distractors = [];
  for(const r of pool){
    if(seen.has(r)) continue;
    seen.add(r);
    distractors.push(r);
    if(distractors.length === 3) break;
  }
  const options = shuffleArray([correctLabel, ...distractors]);
  const correctIdx = options.indexOf(correctLabel);
  return { options, correctIdx, selected: null };
}

function renderKanjiMcqCard(container){
  const pos = mcqIndex;
  const entryIdx = mcqOrder[pos];
  const entry = kanjiExamData[entryIdx];

  if(!mcqStates[pos]){
    mcqStates[pos] = buildKanjiMcqOptions(entryIdx);
  }
  const qState = mcqStates[pos];

  const card = document.createElement('div');
  card.className = 'exam-card';
  card.innerHTML = `<div class="exam-progress">Q ${pos + 1} / ${mcqOrder.length}</div>` +
    `<div class="exam-kanji-big jp">${escapeHtml(entry.kanji)}</div>`;

  const optsWrap = document.createElement('div');
  optsWrap.className = 'options';
  optsWrap.style.marginTop = '24px';
  optsWrap.style.textAlign = 'left';
  const letters = ['A','B','C','D'];
  qState.options.forEach((opt, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.style.textAlign = 'left';
    btn.innerHTML = `<span class="opt-letter">${letters[idx]||(idx+1)}</span><span class="jp">${escapeHtml(opt)}</span>`;
    if(qState.selected !== null){
      btn.disabled = true;
      if(idx === qState.correctIdx) btn.classList.add('correct');
      if(idx === qState.selected && idx !== qState.correctIdx) btn.classList.add('wrong');
    }
    btn.onclick = ()=>{
      if(qState.selected !== null) return;
      qState.selected = idx;
      mcqAnswers[entryIdx] = (idx === qState.correctIdx);
      renderKanjiView();
    };
    optsWrap.appendChild(btn);
  });
  card.appendChild(optsWrap);

  if(qState.selected !== null){
    const isCorrect = qState.selected === qState.correctIdx;
    const resultArea = document.createElement('div');
    resultArea.className = 'result-area show';
    const banner = document.createElement('div');
    banner.className = 'result-banner ' + (isCorrect ? 'ok' : 'no') + ' si';
    banner.textContent = isCorrect ? '✅ හරි උත්තරය!' : '❌ වැරදියි';
    resultArea.appendChild(banner);

    const reveal = document.createElement('div');
    reveal.className = 'answer-reveal';
    reveal.innerHTML = `
      <div class="row">
        <span class="label si">හිරගනා (කියවීම)</span>
        <span class="jp-ans jp">${escapeHtml(entry.reading || qState.options[qState.correctIdx])}</span>
      </div>
      <div class="row">
        <span class="label si">සිංහල තේරුම</span>
        <span class="jp-ans si">${escapeHtml(entry.meaning || '')}</span>
      </div>`;
    resultArea.appendChild(reveal);
    card.appendChild(resultArea);
  }

  container.appendChild(card);

  if(qState.selected !== null){
    const nav = document.createElement('div');
    nav.className = 'nav-row';
    nav.style.justifyContent = 'center';
    const nextBtn = document.createElement('button');
    nextBtn.className = 'nav-btn next';
    nextBtn.textContent = (pos === mcqOrder.length - 1) ? 'See Results →' : 'Next →';
    nextBtn.onclick = ()=>{ mcqIndex++; renderKanjiView(); };
    nav.appendChild(nextBtn);
    container.appendChild(nav);
  }
}

/* ============ MODE TOGGLE ============ */
function setMode(mode){
  const quizView = document.getElementById('quizView');
  const readingView = document.getElementById('readingView');
  const kanjiView = document.getElementById('kanjiView');
  const tabQuiz = document.getElementById('tabQuiz');
  const tabReading = document.getElementById('tabReading');
  const tabKanji = document.getElementById('tabKanji');

  quizView.style.display = 'none';
  readingView.style.display = 'none';
  kanjiView.style.display = 'none';
  tabQuiz.classList.remove('active');
  tabReading.classList.remove('active');
  tabKanji.classList.remove('active');

  if(mode === 'reading'){
    readingView.style.display = 'block';
    tabReading.classList.add('active');
    renderReading();
  } else if(mode === 'kanji'){
    kanjiView.style.display = 'block';
    tabKanji.classList.add('active');
    renderKanjiView();
  } else {
    quizView.style.display = 'block';
    tabQuiz.classList.add('active');
  }
}
document.getElementById('tabQuiz').onclick = ()=> setMode('quiz');
document.getElementById('tabReading').onclick = ()=> setMode('reading');
document.getElementById('tabKanji').onclick = ()=> setMode('kanji');
